<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EuroPerote — Catálogo ProMods</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>__STYLES__</style>
</head>
<body class="booting">
<div id="boot">
  <div class="boot-card">
    <h1 style="font-family:Literata,serif;margin:0 0 .35rem">EuroPerote</h1>
    <p style="margin:0;opacity:.85">Cargando ciudades y rutas ProMods…</p>
    <div class="boot-bar"><div id="bootBar"></div></div>
    <div id="bootPct">0%</div>
    <div id="bootErr" hidden></div>
  </div>
</div>
<div class="mobile-bar">
  <strong>EuroPerote</strong>
  <button id="toggleFilters" type="button">Menú</button>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>EuroPerote</h1>
        <p>ProMods · rutas reales</p>
      </div>
    </div>

    <div class="section-label">Ciudad</div>
    <div class="field">
      <label for="citySelect">Seleccionar ciudad / pueblo</label>
      <input id="citySearch" placeholder="Buscar en el mapa…"/>
      <select id="citySelect" size="8"></select>
    </div>
    <div class="field">
      <label for="cityMode">Al elegir ciudad mostrar</label>
      <select id="cityMode">
        <option value="both">Pasan y cabeceras</option>
        <option value="through">Solo pasan por ella</option>
        <option value="ends">Solo origen o destino</option>
      </select>
    </div>
    <button class="btn-ghost" id="clearCity" type="button">Quitar ciudad</button>

    <div class="section-label">Filtros de ruta</div>
    <div class="field"><label for="q">Texto libre</label><input id="q" placeholder="código, descripción…"/></div>
    <div class="field"><label for="tipo">Tipo</label><select id="tipo"><option value="">Todos</option></select></div>
    <div class="field"><label for="ambito">Ámbito</label><select id="ambito">
      <option value="">Todos</option>
      <option value="nacional">Nacional</option>
      <option value="internacional">Internacional</option>
    </select></div>
    <div class="field"><label for="pais">País</label><select id="pais"><option value="">Todos</option></select></div>
    <div class="field"><label for="addon">Addon</label><select id="addon"><option value="">Todos</option></select></div>

    <div class="actions">
      <button class="btn-primary" id="applyBtn" type="button">Aplicar</button>
      <button class="btn-ghost" id="resetBtn" type="button">Limpiar filtros</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-hero">
        <label for="qTop">Explorar EuroPerote</label>
        <input id="qTop" placeholder="Rutas, códigos o ciudades…"/>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>

    <section class="map-panel">
      <div id="map" role="application" aria-label="Mapa OpenStreetMap de ciudades ProMods"></div>
      <p class="map-hint" id="mapHint">Clic en un marcador o elige ciudad a la izquierda.</p>
    </section>

    <div id="cityPanels" hidden>
      <div class="city-heading" id="cityHeading"></div>
      <div class="city-cols">
        <section>
          <h3>Origen o destino</h3>
          <div class="list" id="listEnds"></div>
        </section>
        <section>
          <h3>Pasan por la ciudad</h3>
          <div class="list" id="listThrough"></div>
        </section>
      </div>
    </div>

    <div class="toolbar" id="allToolbar">
      <div class="left"><span id="resultCount" class="meta"></span></div>
      <div class="right">
        <label class="meta" for="sort">Orden</label>
        <select id="sort">
          <option value="codigo">Código</option>
          <option value="nombre">Nombre</option>
          <option value="paradas_desc">Más paradas</option>
          <option value="km_desc">Más km</option>
          <option value="km_asc">Menos km</option>
        </select>
        <div class="seg" id="pageSizeSeg">
          <button type="button" data-size="24" class="on">24</button>
          <button type="button" data-size="48">48</button>
          <button type="button" data-size="96">96</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager">
      <button type="button" id="prev">Anterior</button>
      <span class="meta" id="pageInfo"></span>
      <button type="button" id="next">Siguiente</button>
    </div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>window.CATALOG_BASE = "__CDN_BASE__";</script>
<script>__APP__</script>
</body>
</html>
