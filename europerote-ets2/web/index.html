<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EuroPerote — Catálogo ProMods</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>:root {
  --ink: #0a1628;
  --paper: #e8eef6;
  --panel: rgba(255,255,255,.92);
  --panel-solid: #f7faff;
  --line: #c5d0e0;
  --muted: #5a6a7e;
  --accent: #0B3D91;
  --accent-2: #F2A900;
  --accent-3: #1a6bb5;
  --chip: #e2ebf7;
  --shadow: 0 18px 50px rgba(10,22,40,.14);
  --radius: 18px;
  --sidebar: 300px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Sora", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1100px 560px at 8% -8%, rgba(11,61,145,.22), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(242,169,0,.16), transparent 48%),
    linear-gradient(165deg, #d9e4f2 0%, var(--paper) 42%, #cfdced 100%);
  min-height: 100vh;
}
h1,h2,h3 { font-family: "Literata", Georgia, serif; font-weight: 700; letter-spacing: -.02em; }
button, input, select { font: inherit; }
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  padding: 1.1rem; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(247,250,255,.97), rgba(232,238,246,.94));
}
.brand { display: flex; gap: .85rem; align-items: center; margin-bottom: .9rem; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
  position: relative;
}
.brand-mark::after {
  content: ""; position: absolute; left: 10px; right: 10px; top: 22px; height: 5px; border-radius: 99px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 -8px 0 rgba(242,169,0,.85), 0 8px 0 rgba(255,255,255,.45);
}
.brand h1 { margin: 0; font-size: 1.25rem; }
.brand p { margin: .15rem 0 0; color: var(--muted); font-size: .8rem; }
.section-label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 700; margin: .9rem 0 .35rem;
}
.field { margin-bottom: .55rem; }
.field label { display: block; font-size: .76rem; font-weight: 600; margin-bottom: .25rem; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
  padding: .5rem .65rem; outline: none;
}
#citySelect { height: 160px; margin-top: .35rem; }
.actions { display: grid; gap: .4rem; margin-top: .8rem; }
.actions button, .btn-ghost, .btn-primary {
  border: 0; border-radius: 12px; padding: .65rem .8rem; cursor: pointer; font-weight: 700; width: 100%;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--line) !important; color: var(--ink); }
.main { padding: 1rem 1.2rem 2.5rem; }
.topbar { display: grid; gap: .7rem; margin-bottom: .7rem; }
.search-hero label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: .25rem; }
.search-hero input {
  width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: .8rem 1rem;
  background: var(--panel); box-shadow: var(--shadow);
}
.metrics { display: flex; flex-wrap: wrap; gap: .4rem; }
.metric {
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px;
  padding: .3rem .65rem; font-size: .76rem; font-weight: 600; color: var(--muted);
}
.metric strong { color: var(--ink); }
.map-panel {
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  background: #fff; box-shadow: var(--shadow); margin-bottom: 1rem;
}
#map { height: min(48vh, 420px); width: 100%; }
.map-hint { margin: 0; padding: .55rem .8rem; font-size: .8rem; color: var(--muted); background: var(--panel-solid); }
.city-heading { margin: .2rem 0 .7rem; }
.city-heading h2 { margin: 0 0 .2rem; font-size: 1.35rem; }
.city-heading p { margin: 0; color: var(--muted); font-size: .9rem; }
.city-cols { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; margin-bottom: 1rem; }
.city-cols h3 { margin: 0 0 .45rem; font-size: 1rem; }
.toolbar {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .55rem;
  align-items: center; margin: .4rem 0 .7rem;
}
.toolbar .right { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.toolbar select { border: 1px solid var(--line); border-radius: 10px; padding: .35rem .5rem; background: #fff; }
.seg { display: flex; gap: .25rem; }
.seg button {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: .3rem .5rem; cursor: pointer; font-weight: 600;
}
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.meta { color: var(--muted); font-size: .85rem; }
.list { display: grid; gap: .65rem; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .9rem 1rem; animation: rise .3s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;} }
.card-head { display: flex; gap: .7rem; justify-content: space-between; align-items: flex-start; }
.code {
  font-weight: 800; letter-spacing: .03em; color: #fff; background: var(--accent);
  border-radius: 10px; padding: .25rem .5rem; font-size: .78rem; white-space: nowrap;
}
.card h2, .card h4 { margin: 0 0 .15rem; font-size: 1.05rem; }
.card .sub { color: var(--muted); font-size: .82rem; margin: 0 0 .45rem; }
.tags { display: flex; flex-wrap: wrap; gap: .28rem; margin: .25rem 0 .45rem; }
.tag {
  font-size: .7rem; font-weight: 700; border-radius: 999px; padding: .18rem .45rem;
  background: var(--chip); color: var(--accent); border: 1px solid #b8cae3;
}
.tag.gold { background: #fff4d6; color: #8a6200; border-color: #ecd48a; }
.desc { font-size: .88rem; line-height: 1.45; color: #243447; margin: .3rem 0; }
.stops {
  font-size: .8rem; color: var(--muted); line-height: 1.4;
  border-top: 1px dashed var(--line); padding-top: .45rem; margin-top: .4rem;
}
.pager { display: flex; justify-content: center; align-items: center; gap: .7rem; margin-top: 1rem; }
.pager button {
  border: 1px solid var(--line); background: #fff; border-radius: 12px;
  padding: .5rem .85rem; cursor: pointer; font-weight: 700;
}
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.mobile-bar {
  display: none; position: sticky; top: 0; z-index: 20;
  background: rgba(10,22,40,.92); color: #fff; padding: .6rem .85rem;
  justify-content: space-between; align-items: center;
}
.mobile-bar button {
  border: 0; background: var(--accent-2); color: #111; font-weight: 800;
  border-radius: 10px; padding: .35rem .65rem; cursor: pointer;
}
#boot {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: linear-gradient(160deg, #0B3D91, #0a1628 60%); color: #fff; text-align: center; padding: 1.5rem;
}
#boot[hidden] { display: none !important; }
.boot-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; margin: 1rem 0 .5rem; }
#bootBar { height: 100%; width: 8%; background: linear-gradient(90deg, var(--accent-2), #fff); transition: width .25s ease; }
body.booting .app, body.booting .mobile-bar { visibility: hidden; }
.leaflet-container { font: inherit; }
.city-marker { background: var(--accent); border: 2px solid #fff; border-radius: 50%; }
.city-marker.selected { background: var(--accent-2); }
@media (max-width: 980px) {
  .mobile-bar { display: flex; }
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 52px 0 auto; z-index: 30; height: auto; max-height: calc(100vh - 52px);
    transform: translateY(-120%); transition: transform .25s ease;
  }
  .sidebar.open { transform: none; }
  .city-cols { grid-template-columns: 1fr; }
  #map { height: 40vh; }
}
</style>
</head>
<body class="booting">
<div id="boot">
  <div class="boot-card">
    <h1 style="font-family:Literata,serif;margin:0 0 .35rem">EuroPerote</h1>
    <p style="margin:0;opacity:.85">Cargando ciudades y rutas ProMods…</p>
    <div class="boot-bar"><div id="bootBar"></div></div>
    <div id="bootPct">0%</div>
    <div id="bootErr" hidden></div>
  </div>
</div>
<div class="mobile-bar">
  <strong>EuroPerote</strong>
  <button id="toggleFilters" type="button">Menú</button>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>EuroPerote</h1>
        <p>ProMods · rutas reales</p>
      </div>
    </div>

    <div class="section-label">Ciudad</div>
    <div class="field">
      <label for="citySelect">Seleccionar ciudad / pueblo</label>
      <input id="citySearch" placeholder="Buscar en el mapa…"/>
      <select id="citySelect" size="8"></select>
    </div>
    <div class="field">
      <label for="cityMode">Al elegir ciudad mostrar</label>
      <select id="cityMode">
        <option value="both">Pasan y cabeceras</option>
        <option value="through">Solo pasan por ella</option>
        <option value="ends">Solo origen o destino</option>
      </select>
    </div>
    <button class="btn-ghost" id="clearCity" type="button">Quitar ciudad</button>

    <div class="section-label">Filtros de ruta</div>
    <div class="field"><label for="q">Texto libre</label><input id="q" placeholder="código, descripción…"/></div>
    <div class="field"><label for="tipo">Tipo</label><select id="tipo"><option value="">Todos</option></select></div>
    <div class="field"><label for="ambito">Ámbito</label><select id="ambito">
      <option value="">Todos</option>
      <option value="nacional">Nacional</option>
      <option value="internacional">Internacional</option>
    </select></div>
    <div class="field"><label for="pais">País</label><select id="pais"><option value="">Todos</option></select></div>
    <div class="field"><label for="addon">Addon</label><select id="addon"><option value="">Todos</option></select></div>

    <div class="actions">
      <button class="btn-primary" id="applyBtn" type="button">Aplicar</button>
      <button class="btn-ghost" id="resetBtn" type="button">Limpiar filtros</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-hero">
        <label for="qTop">Explorar EuroPerote</label>
        <input id="qTop" placeholder="Rutas, códigos o ciudades…"/>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>

    <section class="map-panel">
      <div id="map" role="application" aria-label="Mapa OpenStreetMap de ciudades ProMods"></div>
      <p class="map-hint" id="mapHint">Clic en un marcador o elige ciudad a la izquierda.</p>
    </section>

    <div id="cityPanels" hidden>
      <div class="city-heading" id="cityHeading"></div>
      <div class="city-cols">
        <section>
          <h3>Origen o destino</h3>
          <div class="list" id="listEnds"></div>
        </section>
        <section>
          <h3>Pasan por la ciudad</h3>
          <div class="list" id="listThrough"></div>
        </section>
      </div>
    </div>

    <div class="toolbar" id="allToolbar">
      <div class="left"><span id="resultCount" class="meta"></span></div>
      <div class="right">
        <label class="meta" for="sort">Orden</label>
        <select id="sort">
          <option value="codigo">Código</option>
          <option value="nombre">Nombre</option>
          <option value="paradas_desc">Más paradas</option>
          <option value="km_desc">Más km</option>
          <option value="km_asc">Menos km</option>
        </select>
        <div class="seg" id="pageSizeSeg">
          <button type="button" data-size="24" class="on">24</button>
          <button type="button" data-size="48">48</button>
          <button type="button" data-size="96">96</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager">
      <button type="button" id="prev">Anterior</button>
      <span class="meta" id="pageInfo"></span>
      <button type="button" id="next">Siguiente</button>
    </div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>window.CATALOG_BASE = "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@6315e06f8e26a95d75ef9c457437b88ce07adb5d/europerote-ets2/web";</script>
<script>(() => {
  let DATA = window.CATALOG_DATA && window.CATALOG_DATA.routes ? window.CATALOG_DATA : null;
  const state = {
    page: 0,
    pageSize: 24,
    filtered: [],
    cityId: "",
    map: null,
    markers: new Map(),
    selectedMarker: null,
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uniq = (arr) => [...new Set(arr)].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), "es"));

  function setBoot(pct, err) {
    const bar = $("bootBar");
    const label = $("bootPct");
    const errEl = $("bootErr");
    if (bar) bar.style.width = Math.max(6, Math.min(100, pct)) + "%";
    if (label) label.textContent = err ? "Error" : Math.round(pct) + "%";
    if (errEl && err) {
      errEl.hidden = false;
      errEl.textContent = err;
    }
  }
  function hideBoot() {
    const boot = $("boot");
    if (boot) boot.hidden = true;
    document.body.classList.remove("booting");
  }
  function fetchJson(url) {
    return fetch(url, { cache: "no-cache", mode: "cors" }).then(async (r) => {
      if (!r.ok) throw new Error("HTTP " + r.status + " en " + url.split("/").slice(-2).join("/"));
      return r.json();
    });
  }

  async function loadCatalogFromCdn() {
    const bases = [
      (window.CATALOG_BASE || "").replace(/\/$/, ""),
      "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@cursor/red-ferroviaria-alemania-555a/europerote-ets2/web",
    ].filter((b, i, arr) => b && arr.indexOf(b) === i);

    setBoot(4);
    let lastErr = null;
    for (const base of bases) {
      try {
        const meta = await fetchJson(base + "/meta.json");
        setBoot(12);
        const cities = await fetchJson(base + "/cities.json");
        setBoot(22);
        const total = meta.chunks || 0;
        if (!total) throw new Error("meta.json sin chunks");
        const routes = [];
        const batch = 3;
        for (let i = 0; i < total; i += batch) {
          const slice = [];
          for (let j = i; j < Math.min(total, i + batch); j++) slice.push(j);
          const parts = await Promise.all(slice.map((j) => fetchJson(base + "/chunks/routes-" + j + ".json")));
          parts.forEach((p) => routes.push(...p));
          setBoot(22 + (74 * Math.min(total, i + batch)) / Math.max(total, 1));
        }
        if (!routes.length) throw new Error("No se cargaron rutas");
        setBoot(98);
        return { ...meta, routes, cities: cities.cities || cities };
      } catch (e) {
        lastErr = e;
        console.warn("Fallo carga desde", base, e);
      }
    }
    throw lastErr || new Error("No se pudo cargar el catálogo");
  }

  function fillSelect(id, values, labelFn) {
    const el = $(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">Todos</option>';
    for (const v of values) {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = labelFn ? labelFn(v) : v;
      el.appendChild(opt);
    }
    if (cur) el.value = cur;
  }

  function fillCitySelect(filterText) {
    const el = $("citySelect");
    if (!el || !DATA.cities) return;
    const q = (filterText || "").trim().toLowerCase();
    const list = DATA.cities
      .filter((c) => c.lat != null && c.lon != null)
      .filter((c) => !q || c.nombre.toLowerCase().includes(q) || c.pais.toLowerCase().includes(q) || (c.iso || "").toLowerCase().includes(q))
      .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
    el.innerHTML = "";
    for (const c of list) {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = `${c.nombre} (${c.iso || c.pais})`;
      if (c.id === state.cityId) opt.selected = true;
      el.appendChild(opt);
    }
  }

  function initFilters() {
    fillSelect("tipo", uniq(DATA.routes.map((r) => r.tipo)), (id) => DATA.tipoNames[id] || id);
    fillSelect("pais", uniq(DATA.routes.flatMap((r) => r.paises || [])));
    fillSelect("addon", uniq(DATA.routes.flatMap((r) => r.addons || [])), (id) => DATA.addonNames[id] || id);
    fillCitySelect("");
  }

  function routeCard(r, asH4) {
    const tipo = DATA.tipoNames[r.tipo] || r.tipo;
    const addons = (r.addons || []).map((a) => DATA.addonNames[a] || a).join(" · ");
    const titleTag = asH4 ? "h4" : "h2";
    return (
      '<article class="card">' +
      '<div class="card-head"><div>' +
      `<${titleTag}>` +
      esc(r.nombre) +
      `</${titleTag}>` +
      '<p class="sub">' +
      esc(tipo) +
      " · " +
      esc(r.nacional ? "Nacional" : "Internacional") +
      " · " +
      esc((r.paises || []).join(", ")) +
      " · " +
      esc(r.km) +
      " km · " +
      esc(r.n) +
      " paradas</p></div><span class=\"code\">" +
      esc(r.codigo) +
      "</span></div>" +
      '<div class="tags">' +
      '<span class="tag">' +
      esc(tipo) +
      "</span>" +
      '<span class="tag gold">' +
      esc(r.mat || "") +
      "</span>" +
      (addons ? '<span class="tag">' + esc(addons) + "</span>" : "") +
      "</div>" +
      '<p class="desc">' +
      esc(r.desc || "") +
      "</p>" +
      '<div class="stops"><strong>Itinerario:</strong> ' +
      esc((r.paradas || []).join(" → ")) +
      "</div></article>"
    );
  }

  function baseFilter(r) {
    const q = (($("q")?.value || "") + " " + ($("qTop")?.value || "")).trim().toLowerCase();
    const tipo = $("tipo")?.value || "";
    const pais = $("pais")?.value || "";
    const addon = $("addon")?.value || "";
    const ambito = $("ambito")?.value || "";
    if (tipo && r.tipo !== tipo) return false;
    if (pais && !(r.paises || []).includes(pais)) return false;
    if (addon && !(r.addons || []).includes(addon)) return false;
    if (ambito === "nacional" && !r.nacional) return false;
    if (ambito === "internacional" && r.nacional) return false;
    if (q) {
      const blob = [r.codigo, r.nombre, r.desc, r.mat, ...(r.paradas || []), ...(r.paises || [])].join(" ").toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  }

  function sortRoutes(arr) {
    const sort = $("sort")?.value || "codigo";
    arr.sort((a, b) => {
      if (sort === "nombre") return a.nombre.localeCompare(b.nombre, "es");
      if (sort === "paradas_desc") return b.n - a.n;
      if (sort === "km_desc") return b.km - a.km;
      if (sort === "km_asc") return a.km - b.km;
      return String(a.codigo).localeCompare(String(b.codigo), "es");
    });
  }

  function routesForCity(cityId) {
    const city = DATA.cities.find((c) => c.id === cityId);
    if (!city) return { ends: [], through: [], city: null };
    const name = city.nombre;
    const ends = [];
    const through = [];
    for (const r of DATA.routes) {
      if (!baseFilter(r)) continue;
      const ids = r.paradaIds || [];
      const names = r.paradas || [];
      const hitId = ids.includes(cityId);
      const hitName = names.includes(name);
      if (!hitId && !hitName) continue;
      const isEnd =
        names[0] === name ||
        names[names.length - 1] === name ||
        ids[0] === cityId ||
        ids[ids.length - 1] === cityId;
      if (isEnd) ends.push(r);
      else through.push(r);
    }
    sortRoutes(ends);
    sortRoutes(through);
    return { ends, through, city };
  }

  function applyFilters() {
    if (state.cityId) {
      renderCityView();
      return;
    }
    $("cityPanels").hidden = true;
    $("allToolbar").hidden = false;
    $("list").hidden = false;
    $("pager").hidden = false;

    state.filtered = DATA.routes.filter(baseFilter);
    sortRoutes(state.filtered);
    state.page = 0;
    renderList();
  }

  function renderList() {
    const list = $("list");
    const total = state.filtered.length;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page >= pages) state.page = pages - 1;
    const start = state.page * state.pageSize;
    const slice = state.filtered.slice(start, start + state.pageSize);
    if ($("resultCount")) $("resultCount").textContent = total + " rutas · página " + (state.page + 1) + "/" + pages;
    if ($("pageInfo")) $("pageInfo").textContent = state.page + 1 + " / " + pages;
    if ($("prev")) $("prev").disabled = state.page <= 0;
    if ($("next")) $("next").disabled = state.page >= pages - 1;
    updateMetrics(total);
    list.innerHTML = slice.map((r) => routeCard(r, false)).join("");
  }

  function renderCityView() {
    const mode = $("cityMode")?.value || "both";
    const { ends, through, city } = routesForCity(state.cityId);
    if (!city) return;
    $("cityPanels").hidden = false;
    $("allToolbar").hidden = true;
    $("list").hidden = true;
    $("pager").hidden = true;

    $("cityHeading").innerHTML =
      "<h2>" +
      esc(city.nombre) +
      "</h2><p>" +
      esc(city.pais) +
      " · " +
      esc(city.iso || "") +
      " · ProMods real · " +
      ends.length +
      " cabeceras · " +
      through.length +
      " de paso</p>";

    const showEnds = mode === "both" || mode === "ends";
    const showThrough = mode === "both" || mode === "through";
    $("listEnds").parentElement.hidden = !showEnds;
    $("listThrough").parentElement.hidden = !showThrough;
    $("listEnds").innerHTML = showEnds
      ? ends.length
        ? ends.map((r) => routeCard(r, true)).join("")
        : '<p class="meta">Ninguna ruta con origen/destino aquí.</p>'
      : "";
    $("listThrough").innerHTML = showThrough
      ? through.length
        ? through.map((r) => routeCard(r, true)).join("")
        : '<p class="meta">Ninguna ruta de paso.</p>'
      : "";

    updateMetrics(ends.length + through.length);
    if ($("mapHint")) {
      $("mapHint").textContent = `Ciudad seleccionada: ${city.nombre}. Cabeceras ${ends.length} · De paso ${through.length}.`;
    }
    focusCityOnMap(city.id);
  }

  function updateMetrics(filtered) {
    if (!$("metrics")) return;
    $("metrics").innerHTML =
      '<span class="metric"><strong>' +
      (DATA.total || DATA.routes.length) +
      "</strong> rutas</span>" +
      '<span class="metric"><strong>' +
      (DATA.cities?.length || 0) +
      "</strong> ciudades ProMods</span>" +
      '<span class="metric"><strong>' +
      filtered +
      "</strong> en vista</span>" +
      '<span class="metric">Operador <strong>EuroPerote</strong></span>';
  }

  function initMap() {
    if (!window.L || state.map) return;
    state.map = L.map("map", { scrollWheelZoom: true }).setView([52.5, 13.4], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(state.map);

    const bounds = [];
    for (const c of DATA.cities || []) {
      if (c.lat == null || c.lon == null) continue;
      const marker = L.circleMarker([c.lat, c.lon], {
        radius: 5,
        color: "#fff",
        weight: 1.5,
        fillColor: "#0B3D91",
        fillOpacity: 0.9,
      });
      marker.bindTooltip(c.nombre + " (" + (c.iso || c.pais) + ")", { direction: "top" });
      marker.on("click", () => selectCity(c.id, true));
      marker.addTo(state.map);
      state.markers.set(c.id, marker);
      bounds.push([c.lat, c.lon]);
    }
    if (bounds.length) state.map.fitBounds(bounds, { padding: [24, 24] });
    setTimeout(() => state.map.invalidateSize(), 200);
  }

  function focusCityOnMap(cityId) {
    const marker = state.markers.get(cityId);
    const city = DATA.cities.find((c) => c.id === cityId);
    if (!marker || !city || !state.map) return;
    if (state.selectedMarker) {
      state.selectedMarker.setStyle({ fillColor: "#0B3D91", radius: 5 });
    }
    marker.setStyle({ fillColor: "#F2A900", radius: 9 });
    state.selectedMarker = marker;
    state.map.setView([city.lat, city.lon], Math.max(state.map.getZoom(), 6), { animate: true });
  }

  function selectCity(cityId, fromMap) {
    state.cityId = cityId || "";
    if ($("citySelect") && cityId) $("citySelect").value = cityId;
    if (!fromMap) fillCitySelect($("citySearch")?.value || "");
    applyFilters();
  }

  function bind() {
    $("applyBtn")?.addEventListener("click", applyFilters);
    $("resetBtn")?.addEventListener("click", () => {
      ["q", "qTop", "tipo", "pais", "addon", "ambito", "citySearch"].forEach((id) => {
        if ($(id)) $(id).value = "";
      });
      if ($("cityMode")) $("cityMode").value = "both";
      state.cityId = "";
      fillCitySelect("");
      if (state.selectedMarker) {
        state.selectedMarker.setStyle({ fillColor: "#0B3D91", radius: 5 });
        state.selectedMarker = null;
      }
      applyFilters();
    });
    $("clearCity")?.addEventListener("click", () => {
      state.cityId = "";
      if ($("citySelect")) $("citySelect").selectedIndex = -1;
      if (state.selectedMarker) {
        state.selectedMarker.setStyle({ fillColor: "#0B3D91", radius: 5 });
        state.selectedMarker = null;
      }
      if ($("mapHint")) $("mapHint").textContent = "Clic en un marcador o elige ciudad a la izquierda.";
      applyFilters();
    });
    $("citySelect")?.addEventListener("change", (e) => selectCity(e.target.value, false));
    $("citySearch")?.addEventListener("input", (e) => fillCitySelect(e.target.value));
    $("cityMode")?.addEventListener("change", () => state.cityId && renderCityView());
    ["q", "qTop"].forEach((id) => $(id)?.addEventListener("input", () => applyFilters()));
    ["tipo", "pais", "addon", "ambito", "sort"].forEach((id) => $(id)?.addEventListener("change", () => applyFilters()));
    $("prev")?.addEventListener("click", () => {
      state.page--;
      renderList();
    });
    $("next")?.addEventListener("click", () => {
      state.page++;
      renderList();
    });
    $("pageSizeSeg")?.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-size]");
      if (!btn) return;
      state.pageSize = Number(btn.dataset.size);
      [...$("pageSizeSeg").querySelectorAll("button")].forEach((b) => b.classList.toggle("on", b === btn));
      state.page = 0;
      if (!state.cityId) renderList();
    });
    $("toggleFilters")?.addEventListener("click", () => $("sidebar")?.classList.toggle("open"));
  }

  async function main() {
    try {
      if (!DATA) DATA = await loadCatalogFromCdn();
      if (!DATA.cities) DATA.cities = [];
      window.CATALOG_DATA = DATA;
      initFilters();
      bind();
      initMap();
      applyFilters();
      hideBoot();
    } catch (e) {
      setBoot(100, String(e.message || e));
    }
  }
  main();
})();
</script>
</body>
</html>
