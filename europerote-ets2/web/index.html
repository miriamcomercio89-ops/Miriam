<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EuroPerote — Catálogo de autobuses ProMods</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>:root {
  --ink: #0a1628;
  --paper: #e8eef6;
  --panel: rgba(255,255,255,.9);
  --panel-solid: #f7faff;
  --line: #c5d0e0;
  --muted: #5a6a7e;
  --accent: #0B3D91;
  --accent-2: #F2A900;
  --accent-3: #1a6bb5;
  --chip: #e2ebf7;
  --shadow: 0 18px 50px rgba(10,22,40,.14);
  --radius: 18px;
  --sidebar: 300px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Sora", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1100px 560px at 8% -8%, rgba(11,61,145,.22), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(242,169,0,.18), transparent 48%),
    linear-gradient(165deg, #d9e4f2 0%, var(--paper) 42%, #cfdced 100%);
  min-height: 100vh;
}
h1,h2,h3 { font-family: "Literata", Georgia, serif; font-weight: 700; letter-spacing: -.02em; }
button, input, select { font: inherit; }
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  padding: 1.15rem; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(247,250,255,.97), rgba(232,238,246,.94));
  backdrop-filter: blur(10px);
}
.brand { display: flex; gap: .85rem; align-items: center; margin-bottom: 1rem; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-3) 55%, var(--accent-2));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); position: relative;
}
.brand-mark::after {
  content: ""; position: absolute; left: 10px; right: 10px; top: 22px; height: 5px; border-radius: 99px;
  background: rgba(255,255,255,.9);
  box-shadow: 0 -8px 0 rgba(242,169,0,.85), 0 8px 0 rgba(255,255,255,.45);
}
.brand h1 { margin: 0; font-size: 1.28rem; line-height: 1.1; }
.brand p { margin: .15rem 0 0; color: var(--muted); font-size: .8rem; }
.section-label {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 700; margin: .95rem 0 .4rem;
}
.field { margin-bottom: .65rem; }
.field label { display: block; font-size: .76rem; font-weight: 600; margin-bottom: .25rem; color: #334155; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
  padding: .55rem .68rem; outline: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,61,145,.14); }
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.actions { display: grid; gap: .4rem; margin-top: .9rem; }
.actions button { border: 0; border-radius: 12px; padding: .68rem .8rem; cursor: pointer; font-weight: 700; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--line) !important; color: var(--ink); }
.main { padding: 1.15rem 1.3rem 3rem; }
.topbar { display: grid; gap: .75rem; margin-bottom: .85rem; }
.search-hero label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: .3rem; }
.search-hero input {
  width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: .85rem 1rem;
  background: var(--panel); box-shadow: var(--shadow); font-size: 1.02rem;
}
.metrics { display: flex; flex-wrap: wrap; gap: .45rem; }
.metric {
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px;
  padding: .35rem .7rem; font-size: .78rem; font-weight: 600; color: var(--muted);
}
.metric strong { color: var(--ink); }
.toolbar {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem;
  align-items: center; margin: .5rem 0 .85rem;
}
.toolbar .right { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
.toolbar select { border: 1px solid var(--line); border-radius: 10px; padding: .4rem .55rem; background: #fff; }
.seg { display: flex; gap: .25rem; }
.seg button {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: .35rem .55rem; cursor: pointer; font-weight: 600;
}
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.meta { color: var(--muted); font-size: .85rem; }
.list { display: grid; gap: .75rem; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.05rem; box-shadow: 0 8px 28px rgba(10,22,40,.06);
  animation: rise .35s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card-head { display: flex; gap: .75rem; align-items: flex-start; justify-content: space-between; }
.code {
  font-weight: 800; letter-spacing: .04em; color: #fff; background: var(--accent);
  border-radius: 10px; padding: .28rem .55rem; font-size: .82rem; white-space: nowrap;
}
.card h2 { margin: 0 0 .2rem; font-size: 1.12rem; }
.card .sub { color: var(--muted); font-size: .84rem; margin: 0 0 .55rem; }
.tags { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0 .55rem; }
.tag {
  font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .22rem .5rem;
  background: var(--chip); color: var(--accent); border: 1px solid #b8cae3;
}
.tag.gold { background: #fff4d6; color: #8a6200; border-color: #ecd48a; }
.desc { font-size: .9rem; line-height: 1.45; color: #243447; margin: .4rem 0; }
.stops {
  font-size: .82rem; color: var(--muted); line-height: 1.4;
  border-top: 1px dashed var(--line); padding-top: .55rem; margin-top: .45rem;
}
.pager {
  display: flex; justify-content: center; align-items: center; gap: .75rem; margin-top: 1.2rem;
}
.pager button {
  border: 1px solid var(--line); background: #fff; border-radius: 12px;
  padding: .55rem .9rem; cursor: pointer; font-weight: 700;
}
.pager button:disabled { opacity: .4; cursor: not-allowed; }
.mobile-bar {
  display: none; position: sticky; top: 0; z-index: 20;
  background: rgba(10,22,40,.92); color: #fff; padding: .65rem .9rem;
  justify-content: space-between; align-items: center; backdrop-filter: blur(8px);
}
.mobile-bar button {
  border: 0; background: var(--accent-2); color: #111; font-weight: 800;
  border-radius: 10px; padding: .4rem .7rem; cursor: pointer;
}
#boot {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: linear-gradient(160deg, #0B3D91, #0a1628 60%);
  color: #fff; text-align: center; padding: 1.5rem;
}
#boot[hidden] { display: none !important; }
.boot-card { width: min(420px, 100%); }
.boot-bar {
  height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; margin: 1rem 0 .5rem;
}
#bootBar { height: 100%; width: 8%; background: linear-gradient(90deg, var(--accent-2), #fff); transition: width .25s ease; }
#bootErr { color: #ffb4b4; margin-top: .8rem; }
body.booting .app, body.booting .mobile-bar { visibility: hidden; }
@media (max-width: 900px) {
  .mobile-bar { display: flex; }
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 52px 0 auto; z-index: 30; height: auto; max-height: calc(100vh - 52px);
    transform: translateY(-120%); transition: transform .25s ease; border-bottom: 1px solid var(--line);
  }
  .sidebar.open { transform: none; }
  .main { padding: 1rem .85rem 2.5rem; }
}
</style>
</head>
<body class="booting">
<div id="boot">
  <div class="boot-card">
    <h1 style="font-family:Literata,serif;margin:0 0 .35rem">EuroPerote</h1>
    <p style="margin:0;opacity:.85">Cargando red de autobuses ProMods…</p>
    <div class="boot-bar"><div id="bootBar"></div></div>
    <div id="bootPct">0%</div>
    <div id="bootErr" hidden></div>
  </div>
</div>
<div class="mobile-bar">
  <strong>EuroPerote</strong>
  <button id="toggleFilters" type="button">Filtros</button>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>EuroPerote</h1>
        <p>ETS2 · ProMods completo</p>
      </div>
    </div>

    <div id="filters-routes">
      <div class="section-label">Búsqueda</div>
      <div class="field"><label for="q">Texto libre</label><input id="q" placeholder="código, ciudad, descripción…"/></div>
      <div class="field"><label for="qStop">Parada concreta</label><input id="qStop" placeholder="p.ej. Colonia, Riga, Madrid…"/></div>

      <div class="section-label">Clasificación</div>
      <div class="field"><label for="tipo">Tipo de línea</label><select id="tipo"><option value="">Todos</option></select></div>
      <div class="field"><label for="pais">País</label><select id="pais"><option value="">Todos</option></select></div>
      <div class="field"><label for="addon">Addon / mapa</label><select id="addon"><option value="">Todos</option></select></div>
      <div class="field"><label for="material">Autobús</label><select id="material"><option value="">Todos</option></select></div>
      <div class="field"><label for="patron">Patrón</label><select id="patron">
        <option value="">Todos</option>
        <option value="parador">Parador</option>
        <option value="base">Base</option>
        <option value="directo">Directo</option>
      </select></div>

      <div class="section-label">Rangos</div>
      <div class="field"><label>Paradas (min–max)</label><div class="range-row"><input id="minN" type="number" min="2" placeholder="mín"/><input id="maxN" type="number" min="2" placeholder="máx"/></div></div>
      <div class="field"><label>Distancia km (min–max)</label><div class="range-row"><input id="minKm" type="number" min="0" placeholder="mín"/><input id="maxKm" type="number" min="0" placeholder="máx"/></div></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="applyBtn" type="button">Aplicar filtros</button>
      <button class="btn-ghost" id="resetBtn" type="button">Limpiar todo</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-hero">
        <label for="qTop">Explorar EuroPerote</label>
        <input id="qTop" placeholder="Busca rutas, códigos o ciudades…"/>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="toolbar">
      <div class="left"><span id="resultCount" class="meta"></span></div>
      <div class="right">
        <label class="meta" for="sort">Orden</label>
        <select id="sort">
          <option value="codigo">Código</option>
          <option value="nombre">Nombre</option>
          <option value="paradas_desc">Más paradas</option>
          <option value="paradas_asc">Menos paradas</option>
          <option value="km_desc">Más km</option>
          <option value="km_asc">Menos km</option>
        </select>
        <div class="seg" id="pageSizeSeg">
          <button type="button" data-size="24" class="on">24</button>
          <button type="button" data-size="48">48</button>
          <button type="button" data-size="96">96</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager">
      <button type="button" id="prev">Anterior</button>
      <span class="meta" id="pageInfo"></span>
      <button type="button" id="next">Siguiente</button>
    </div>
  </main>
</div>
<script>window.CATALOG_BASE = "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@c8d387bd03510f7d4c4ddafea13ed35676bd5ca6/europerote-ets2/web";</script>
<script>(() => {
  let DATA = window.CATALOG_DATA && window.CATALOG_DATA.routes ? window.CATALOG_DATA : null;
  const state = { page: 0, pageSize: 24, filtered: [] };

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const uniq = (arr) =>
    [...new Set(arr)].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), "es"));

  function setBoot(pct, err) {
    const bar = $("bootBar");
    const label = $("bootPct");
    const errEl = $("bootErr");
    if (bar) bar.style.width = Math.max(6, Math.min(100, pct)) + "%";
    if (label) label.textContent = err ? "Error" : Math.round(pct) + "%";
    if (errEl && err) {
      errEl.hidden = false;
      errEl.textContent = err;
    }
  }

  function hideBoot() {
    const boot = $("boot");
    if (boot) boot.hidden = true;
    document.body.classList.remove("booting");
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-cache", mode: "cors" }).then(async (r) => {
      if (!r.ok) throw new Error("HTTP " + r.status + " en " + url.split("/").slice(-2).join("/"));
      return r.json();
    });
  }

  async function loadCatalogFromCdn() {
    const bases = [
      (window.CATALOG_BASE || "").replace(/\/$/, ""),
      "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@cursor/red-ferroviaria-alemania-555a/europerote-ets2/web",
    ].filter((b, i, arr) => b && arr.indexOf(b) === i);

    setBoot(4);
    let lastErr = null;
    for (const base of bases) {
      try {
        const meta = await fetchJson(base + "/meta.json");
        setBoot(14);
        const total = meta.chunks || 0;
        if (!total) throw new Error("meta.json sin chunks");
        const routes = [];
        const batch = 3;
        for (let i = 0; i < total; i += batch) {
          const slice = [];
          for (let j = i; j < Math.min(total, i + batch); j++) slice.push(j);
          const parts = await Promise.all(slice.map((j) => fetchJson(base + "/chunks/routes-" + j + ".json")));
          parts.forEach((p) => routes.push(...p));
          setBoot(14 + (82 * Math.min(total, i + batch)) / Math.max(total, 1));
        }
        if (!routes.length) throw new Error("No se cargaron rutas");
        setBoot(98);
        return { ...meta, routes };
      } catch (e) {
        lastErr = e;
        console.warn("Fallo carga desde", base, e);
      }
    }
    throw lastErr || new Error("No se pudo cargar el catálogo");
  }

  function fillSelect(id, values, labelFn) {
    const el = $(id);
    if (!el) return;
    const cur = el.value;
    el.innerHTML = '<option value="">Todos</option>';
    for (const v of values) {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = labelFn ? labelFn(v) : v;
      el.appendChild(opt);
    }
    if (cur) el.value = cur;
  }

  function initFilters() {
    fillSelect("tipo", uniq(DATA.routes.map((r) => r.tipo)), (id) => DATA.tipoNames[id] || id);
    fillSelect("pais", uniq(DATA.routes.flatMap((r) => r.paises || [])));
    fillSelect("addon", uniq(DATA.routes.flatMap((r) => r.addons || [])), (id) => DATA.addonNames[id] || id);
    fillSelect("material", uniq(DATA.routes.map((r) => r.mat)));
  }

  function applyFilters() {
    const q = (($("q")?.value || "") + " " + ($("qTop")?.value || "")).trim().toLowerCase();
    const qStop = ($("qStop")?.value || "").trim().toLowerCase();
    const tipo = $("tipo")?.value || "";
    const pais = $("pais")?.value || "";
    const addon = $("addon")?.value || "";
    const material = $("material")?.value || "";
    const patron = $("patron")?.value || "";
    const minN = Number($("minN")?.value || 0);
    const maxN = Number($("maxN")?.value || 0);
    const minKm = Number($("minKm")?.value || 0);
    const maxKm = Number($("maxKm")?.value || 0);

    state.filtered = DATA.routes.filter((r) => {
      if (tipo && r.tipo !== tipo) return false;
      if (pais && !(r.paises || []).includes(pais)) return false;
      if (addon && !(r.addons || []).includes(addon)) return false;
      if (material && r.mat !== material) return false;
      if (patron && r.patron !== patron) return false;
      if (minN && r.n < minN) return false;
      if (maxN && r.n > maxN) return false;
      if (minKm && r.km < minKm) return false;
      if (maxKm && r.km > maxKm) return false;
      if (qStop) {
        const hit = (r.paradas || []).some((p) => String(p).toLowerCase().includes(qStop));
        if (!hit) return false;
      }
      if (q) {
        const blob = [r.codigo, r.nombre, r.desc, r.mat, ...(r.paradas || []), ...(r.paises || [])].join(" ").toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });

    const sort = $("sort")?.value || "codigo";
    state.filtered.sort((a, b) => {
      if (sort === "nombre") return a.nombre.localeCompare(b.nombre, "es");
      if (sort === "paradas_desc") return b.n - a.n;
      if (sort === "paradas_asc") return a.n - b.n;
      if (sort === "km_desc") return b.km - a.km;
      if (sort === "km_asc") return a.km - b.km;
      return String(a.codigo).localeCompare(String(b.codigo), "es");
    });
    state.page = 0;
    render();
  }

  function render() {
    const list = $("list");
    const total = state.filtered.length;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page >= pages) state.page = pages - 1;
    const start = state.page * state.pageSize;
    const slice = state.filtered.slice(start, start + state.pageSize);

    if ($("resultCount")) $("resultCount").textContent = total + " rutas · página " + (state.page + 1) + "/" + pages;
    if ($("pageInfo")) $("pageInfo").textContent = state.page + 1 + " / " + pages;
    if ($("prev")) $("prev").disabled = state.page <= 0;
    if ($("next")) $("next").disabled = state.page >= pages - 1;

    if ($("metrics")) {
      $("metrics").innerHTML =
        '<span class="metric"><strong>' +
        (DATA.total || DATA.routes.length) +
        "</strong> en catálogo</span>" +
        '<span class="metric"><strong>' +
        total +
        "</strong> filtradas</span>" +
        '<span class="metric">Operador <strong>EuroPerote</strong></span>';
    }

    list.innerHTML = slice
      .map((r) => {
        const tipo = DATA.tipoNames[r.tipo] || r.tipo;
        const addons = (r.addons || []).map((a) => DATA.addonNames[a] || a).join(" · ");
        return (
          '<article class="card">' +
          '<div class="card-head"><div>' +
          "<h2>" +
          esc(r.nombre) +
          "</h2>" +
          '<p class="sub">' +
          esc(tipo) +
          " · " +
          esc((r.paises || []).join(", ")) +
          " · " +
          esc(r.km) +
          " km · " +
          esc(r.n) +
          " paradas</p>" +
          "</div><span class=\"code\">" +
          esc(r.codigo) +
          "</span></div>" +
          '<div class="tags">' +
          '<span class="tag">' +
          esc(tipo) +
          "</span>" +
          '<span class="tag gold">' +
          esc(r.mat || "") +
          "</span>" +
          (r.patron ? '<span class="tag">' + esc(r.patron) + "</span>" : "") +
          (addons ? '<span class="tag">' + esc(addons) + "</span>" : "") +
          "</div>" +
          '<p class="desc">' +
          esc(r.desc || "") +
          "</p>" +
          '<div class="stops"><strong>Itinerario:</strong> ' +
          esc((r.paradas || []).join(" → ")) +
          "</div></article>"
        );
      })
      .join("");
  }

  function bind() {
    $("applyBtn")?.addEventListener("click", applyFilters);
    $("resetBtn")?.addEventListener("click", () => {
      ["q", "qTop", "qStop", "tipo", "pais", "addon", "material", "patron", "minN", "maxN", "minKm", "maxKm"].forEach((id) => {
        const el = $(id);
        if (el) el.value = "";
      });
      applyFilters();
    });
    ["q", "qTop", "qStop"].forEach((id) => $(id)?.addEventListener("input", () => applyFilters()));
    ["tipo", "pais", "addon", "material", "patron", "sort"].forEach((id) =>
      $(id)?.addEventListener("change", () => applyFilters())
    );
    $("prev")?.addEventListener("click", () => {
      state.page--;
      render();
    });
    $("next")?.addEventListener("click", () => {
      state.page++;
      render();
    });
    $("pageSizeSeg")?.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-size]");
      if (!btn) return;
      state.pageSize = Number(btn.dataset.size);
      [...$("pageSizeSeg").querySelectorAll("button")].forEach((b) => b.classList.toggle("on", b === btn));
      state.page = 0;
      render();
    });
    $("toggleFilters")?.addEventListener("click", () => $("sidebar")?.classList.toggle("open"));
  }

  async function main() {
    try {
      if (!DATA) DATA = await loadCatalogFromCdn();
      window.CATALOG_DATA = DATA;
      initFilters();
      bind();
      applyFilters();
      hideBoot();
    } catch (e) {
      setBoot(100, String(e.message || e));
    }
  }

  main();
})();
</script>
</body>
</html>
