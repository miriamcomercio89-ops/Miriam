<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ferrocarriles Alemania — Catálogo interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>:root {
  --ink: #101820;
  --paper: #f4efe6;
  --panel: rgba(255,252,247,.88);
  --panel-solid: #fffaf3;
  --line: #d9d0c2;
  --muted: #6b645a;
  --accent: #0b6e4f;
  --accent-2: #c45c26;
  --accent-3: #1d4e89;
  --chip: #efe7da;
  --shadow: 0 18px 50px rgba(16,24,32,.12);
  --radius: 18px;
  --sidebar: 320px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Outfit", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(11,110,79,.18), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(196,92,38,.16), transparent 50%),
    linear-gradient(180deg, #efe7da 0%, var(--paper) 40%, #e7e0d4 100%);
  min-height: 100vh;
}
h1,h2,h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; letter-spacing: -.02em; }
button, input, select { font: inherit; }
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  padding: 1.25rem; border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,250,243,.96), rgba(244,239,230,.92));
  backdrop-filter: blur(10px);
}
.brand { display: flex; gap: .85rem; align-items: center; margin-bottom: 1.1rem; }
.brand-mark {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #14967a 45%, var(--accent-3));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); position: relative;
}
.brand-mark::after {
  content: ""; position: absolute; inset: 14px 8px auto; height: 4px; border-radius: 99px;
  background: rgba(255,255,255,.85);
  box-shadow: 0 8px 0 rgba(255,255,255,.55), 0 16px 0 rgba(255,255,255,.35);
}
.brand h1 { margin: 0; font-size: 1.35rem; line-height: 1.1; }
.brand p { margin: .15rem 0 0; color: var(--muted); font-size: .82rem; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-bottom: 1rem; }
.nav button {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: .55rem .7rem; cursor: pointer; font-weight: 600; color: var(--ink); transition: .2s ease;
}
.nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.section-label {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 700; margin: 1rem 0 .45rem;
}
.field { margin-bottom: .7rem; }
.field label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: .28rem; color: #3f3a34; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
  padding: .58rem .7rem; outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,110,79,.15); }
.range-row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip {
  border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 999px; padding: .28rem .6rem; font-size: .78rem; font-weight: 600;
  cursor: pointer; transition: .15s ease;
}
.chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.actions { display: grid; gap: .45rem; margin-top: 1rem; }
.actions button { border: 0; border-radius: 12px; padding: .7rem .85rem; cursor: pointer; font-weight: 700; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--line) !important; color: var(--ink); }
.main { padding: 1.25rem 1.4rem 3rem; }
.topbar {
  display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; justify-content: space-between; margin-bottom: 1rem;
}
.search-hero {
  flex: 1; min-width: min(100%, 420px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: .85rem 1rem; box-shadow: var(--shadow);
}
.search-hero label { display:block; font-size:.75rem; font-weight:700; color:var(--muted); margin-bottom:.25rem; }
.search-hero input {
  width: 100%; border: 0; background: transparent; font-size: 1.15rem; outline: none;
  font-family: "Fraunces", Georgia, serif; font-weight: 500;
}
.metrics { display: flex; flex-wrap: wrap; gap: .5rem; }
.metric {
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px;
  padding: .65rem .85rem; min-width: 110px; box-shadow: var(--shadow);
}
.metric b { display:block; font-size: 1.2rem; font-family: "Fraunces", Georgia, serif; }
.metric span { color: var(--muted); font-size: .75rem; }
.active-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .2rem 0 1rem; min-height: 1.5rem; }
.af {
  display: inline-flex; gap: .35rem; align-items: center;
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: .25rem .55rem; font-size: .78rem;
}
.af button { border:0; background:transparent; cursor:pointer; color:var(--muted); font-weight:700; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-bottom: .8rem;
}
.toolbar .left, .toolbar .right { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
.seg {
  display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .18rem;
}
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: .4rem .7rem;
  cursor: pointer; font-weight: 600; color: var(--muted);
}
.seg button.on { background: var(--ink); color: #fff; }
.list { display: grid; gap: .7rem; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s; cursor: pointer;
}
.card:hover { transform: translateY(-1px); border-color: #cbbfae; }
.card-head { display:flex; gap:.8rem; align-items:flex-start; justify-content:space-between; }
.left-head { display:flex; gap:.75rem; align-items:flex-start; min-width:0; }
.swatch {
  width: 14px; height: 14px; border-radius: 99px; display:inline-block;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}
.logo {
  width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex: 0 0 auto;
  background: #fff; border: 1px solid var(--line);
}
.code { font-weight: 700; font-size: .95rem; display:flex; gap:.4rem; align-items:center; }
.title { font-family: "Fraunces", Georgia, serif; font-size: 1.08rem; margin: .15rem 0; }
.meta { color: var(--muted); font-size: .84rem; display:flex; flex-wrap:wrap; gap:.35rem .65rem; }
.badge {
  display:inline-flex; align-items:center; border-radius:999px; padding:.12rem .5rem;
  font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
}
.b-actual { background:#d8f3e5; color:#0b6e4f; }
.b-futuro { background:#ffe5cf; color:#9a4a12; }
.b-inventado { background:#dde8f8; color:#1d4e89; }
.b-soft { background:#efe7da; color:#4d463c; }
.stops {
  margin-top: .75rem; padding-top: .7rem; border-top: 1px dashed var(--line);
  font-size: .86rem; line-height: 1.45; color: #3f3a34;
}
.stops .dot { opacity:.45; margin: 0 .2rem; }
.stops .end { font-weight: 700; color: var(--ink); }
.pager {
  display:flex; gap:.5rem; align-items:center; justify-content:center; margin-top: 1.1rem; flex-wrap:wrap;
}
.pager button {
  border: 1px solid var(--line); background:#fff; border-radius: 12px; padding:.55rem .85rem;
  cursor:pointer; font-weight:700;
}
.pager button:disabled { opacity:.4; cursor:not-allowed; }
.empty {
  text-align:center; padding: 3rem 1rem; color: var(--muted);
  border: 1px dashed var(--line); border-radius: var(--radius); background: rgba(255,255,255,.4);
}
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(16,24,32,.35); opacity: 0; pointer-events:none;
  transition: .2s ease; z-index: 20;
}
.drawer-backdrop.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 100%);
  background: var(--panel-solid); border-left: 1px solid var(--line);
  transform: translateX(105%); transition: transform .25s ease; z-index: 21;
  padding: 1.2rem; overflow: auto; box-shadow: var(--shadow);
}
.drawer.on { transform: translateX(0); }
.drawer h2 { margin: 0 0 .4rem; font-size: 1.4rem; }
.drawer .close {
  position:absolute; top:.8rem; right:.8rem; border:1px solid var(--line); background:#fff;
  border-radius: 999px; width:36px; height:36px; cursor:pointer; font-weight:700;
}
.kv { display:grid; grid-template-columns: 110px 1fr; gap:.35rem .6rem; font-size:.9rem; margin:1rem 0; }
.kv div:nth-child(odd) { color: var(--muted); }
.mobile-bar {
  display:none; position: sticky; top: 0; z-index: 10; padding: .7rem .9rem;
  background: rgba(244,239,230,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
}
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: min(360px, 92vw); z-index: 30;
    transform: translateX(-105%); transition: transform .25s ease; box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-bar { display:flex; gap:.5rem; align-items:center; justify-content:space-between; }
  .mobile-bar button {
    border:1px solid var(--line); background:#fff; border-radius:12px; padding:.55rem .8rem; font-weight:700; cursor:pointer;
  }
}

  #boot {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1.25rem;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(11,110,79,.18), transparent 55%),
      linear-gradient(180deg, #efe7da, #f4efe6);
    font-family: "Outfit", system-ui, sans-serif; color: #101820;
  }
  #boot[hidden] { display: none !important; }
  .boot-card {
    width: min(420px, 100%); background: rgba(255,250,243,.97);
    border: 1px solid #d9d0c2; border-radius: 22px; padding: 1.35rem 1.25rem;
    box-shadow: 0 18px 50px rgba(16,24,32,.12);
  }
  .boot-card h1 { font-family: "Fraunces", Georgia, serif; margin: 0 0 .35rem; font-size: 1.4rem; }
  .boot-card p { margin: 0; color: #6b645a; line-height: 1.45; }
  .bar { height: 8px; border-radius: 99px; background: #efe7da; margin: 1rem 0 .5rem; overflow: hidden; }
  .bar > i { display:block; height:100%; width:6%; background:#0b6e4f; border-radius:99px; transition: width .2s ease; }
  #bootPct { font-size: .82rem; font-weight: 700; color: #0b6e4f; }
  #bootErr { color: #9a4a12; margin-top: .75rem; font-size: .9rem; }
  body.booting .app, body.booting .mobile-bar, body.booting .drawer, body.booting .drawer-backdrop { visibility: hidden; }
</style>
</head>
<body class="booting">
<div id="boot">
  <div class="boot-card">
    <h1>Atlas Ferroviario DE</h1>
    <p>Cargando la web interactiva (rutas, filtros y detalle)…</p>
    <div class="bar"><i id="bootBar"></i></div>
    <div id="bootPct">Iniciando…</div>
    <div id="bootErr" hidden></div>
  </div>
</div>
<div class="mobile-bar">
  <strong>Ferrocarriles Alemania</strong>
  <button id="toggleFilters" type="button">Filtros</button>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Atlas Ferroviario DE</h1>
        <p>Alemania · operadores y rutas</p>
      </div>
    </div>
    <div class="nav">
      <button type="button" class="active" data-view="routes">Rutas</button>
      <button type="button" data-view="ops">Operadores</button>
    </div>

    <div id="filters-routes">
      <div class="section-label">Búsqueda</div>
      <div class="field"><label for="q">Texto libre</label><input id="q" placeholder="código, ruta, estación, operador…"/></div>
      <div class="field"><label for="qStation">Estación concreta</label><input id="qStation" placeholder="p.ej. York, Euston, Cardiff…"/></div>
      <div class="field"><label for="qEndpoint">Solo origen o destino</label><input id="qEndpoint" placeholder="extremo de la ruta"/></div>

      <div class="section-label">Clasificación</div>
      <div class="field"><label>Estado del operador</label><div class="chips" id="estChips"></div></div>
      <div class="field"><label for="tipo">Tipo de línea</label><select id="tipo"><option value="">Todos</option></select></div>
      <div class="field"><label for="prefijo">Prefijo</label><select id="prefijo"><option value="">Todos</option></select></div>
      <div class="field"><label for="op">Operador</label><select id="op"><option value="">Todos</option></select></div>
      <div class="field"><label for="opTipo">Tipo de operador</label><select id="opTipo"><option value="">Todos</option></select></div>
      <div class="field"><label for="corredor">Corredor</label><select id="corredor"><option value="">Todos / sin filtrar</option></select></div>
      <div class="field"><label for="land">Región</label><select id="land"><option value="">Todas</option></select></div>
      <div class="field"><label for="origenDatos">Origen de datos</label><select id="origenDatos">
        <option value="">Todos</option><option value="real">Real</option><option value="hibrida">Híbrida</option><option value="ficticia">Ficticia</option>
      </select></div>
      <div class="field"><label for="patron">Patrón</label><select id="patron">
        <option value="">Todos</option><option value="parador">Parador</option><option value="base">Base</option><option value="directo">Directo</option><option value="retorno">Retorno</option>
      </select></div>

      <div class="section-label">Servicio y material</div>
      <div class="field"><label for="material">Material móvil</label><select id="material"><option value="">Todos</option></select></div>
      <div class="field"><label for="qMaterial">Buscar material</label><input id="qMaterial" placeholder="Class 800, Pendolino…"/></div>
      <div class="field"><label>Primer tren (desde–hasta HH:MM)</label><div class="range-row"><input id="minPrimer" placeholder="05:00"/><input id="maxPrimer" placeholder="08:00"/></div></div>
      <div class="field"><label>Último tren (desde–hasta HH:MM)</label><div class="range-row"><input id="minUltimo" placeholder="20:00"/><input id="maxUltimo" placeholder="23:59"/></div></div>

      <div class="section-label">Rangos</div>
      <div class="field"><label>Paradas (min–max)</label><div class="range-row"><input id="minN" type="number" min="2" placeholder="mín"/><input id="maxN" type="number" min="2" placeholder="máx"/></div></div>
      <div class="field"><label>Distancia km (min–max)</label><div class="range-row"><input id="minKm" type="number" min="0" placeholder="mín"/><input id="maxKm" type="number" min="0" placeholder="máx"/></div></div>
      <div class="field"><label>Frecuencia min (min–max)</label><div class="range-row"><input id="minFreq" type="number" min="0" placeholder="mín"/><input id="maxFreq" type="number" min="0" placeholder="máx"/></div></div>
      <div class="field"><label>Trenes asignados (min–max)</label><div class="range-row"><input id="minTrenes" type="number" min="1" placeholder="mín"/><input id="maxTrenes" type="number" min="1" placeholder="máx"/></div></div>
      <div class="field"><label>Precio completo £ (min–max)</label><div class="range-row"><input id="minPrice" type="number" min="0" step="0.1" placeholder="mín"/><input id="maxPrice" type="number" min="0" step="0.1" placeholder="máx"/></div></div>
    </div>

    <div id="filters-ops" hidden>
      <div class="section-label">Operadores</div>
      <div class="field"><label for="opq">Buscar</label><input id="opq" placeholder="nombre, sede, eslogan…"/></div>
      <div class="field"><label>Estado</label><div class="chips" id="opEstChips"></div></div>
      <div class="field"><label for="opTipo2">Tipo</label><select id="opTipo2"><option value="">Todos</option></select></div>
      <div class="field"><label for="opComp">Competencia</label><select id="opComp">
        <option value="">Todas</option><option value="dominante">Dominante</option><option value="competitiva">Competitiva</option><option value="nicho">Nicho</option>
      </select></div>
      <div class="field"><label for="opLand">Región</label><select id="opLand"><option value="">Todas</option></select></div>
      <div class="field"><label for="opServ">Servicio</label><select id="opServ"><option value="">Todos</option></select></div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="applyBtn" type="button">Aplicar filtros</button>
      <button class="btn-ghost" id="resetBtn" type="button">Limpiar todo</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-hero">
        <label for="qTop">Explorar catálogo</label>
        <input id="qTop" placeholder="Escribe y filtra al instante…"/>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="toolbar">
      <div class="left"><span id="resultCount" class="meta"></span></div>
      <div class="right">
        <label class="meta" for="sort">Orden</label>
        <select id="sort">
          <option value="relevancia">Relevancia</option>
          <option value="codigo">Código</option>
          <option value="nombre">Nombre</option>
          <option value="paradas_desc">Más paradas</option>
          <option value="paradas_asc">Menos paradas</option>
          <option value="km_desc">Más km</option>
          <option value="km_asc">Menos km</option>
          <option value="freq_asc">Más frecuente</option>
          <option value="precio_asc">Precio ↑</option>
          <option value="precio_desc">Precio ↓</option>
          <option value="trenes_desc">Más trenes</option>
          <option value="primer_asc">Primer tren ↑</option>
        </select>
        <div class="seg" id="pageSizeSeg">
          <button type="button" data-size="24" class="on">24</button>
          <button type="button" data-size="48">48</button>
          <button type="button" data-size="96">96</button>
        </div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager">
      <button type="button" id="prev">Anterior</button>
      <span id="pageInfo" class="meta"></span>
      <button type="button" id="next">Siguiente</button>
    </div>
  </main>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-live="polite">
  <button class="close" id="closeDrawer" type="button" aria-label="Cerrar">×</button>
  <div id="drawerBody"></div>
</aside>
<script>
window.CATALOG_BASE = "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@9b93f2fc4083e736885b884762714a645047542e/ferrocarriles-uk/web";
window.CATALOG_DATA = null;
(() => {
  let DATA = window.CATALOG_DATA && window.CATALOG_DATA.routes ? window.CATALOG_DATA : null;
  const state = {
    view: "routes",
    page: 0,
    pageSize: 24,
    est: new Set(),
    opEst: new Set(),
    filtered: [],
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const uniq = (arr) =>
    [...new Set(arr)].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), "es"));

  function setBoot(pct, err) {
    const bar = $("bootBar");
    const label = $("bootPct");
    const errEl = $("bootErr");
    if (bar) bar.style.width = Math.max(6, Math.min(100, pct)) + "%";
    if (label) label.textContent = err ? "Error" : Math.round(pct) + "%";
    if (errEl) {
      if (err) {
        errEl.hidden = false;
        errEl.textContent = err;
      }
    }
  }

  function hideBoot() {
    const boot = $("boot");
    if (boot) boot.hidden = true;
    document.body.classList.remove("booting");
  }

  async function loadCatalogFromCdn() {
    const bases = [
      (window.CATALOG_BASE || "").replace(/\/$/, ""),
      "https://cdn.jsdelivr.net/gh/miriamcomercio89-ops/Miriam@cursor/red-ferroviaria-alemania-555a/ferrocarriles-uk/web",
    ].filter((b, i, arr) => b && arr.indexOf(b) === i);

    setBoot(3);
    let lastErr = null;
    for (const base of bases) {
      try {
        setBoot(6);
        const meta = await fetchJson(base + "/meta.json");
        setBoot(15);
        const total = meta.chunks || 0;
        if (!total) throw new Error("meta.json sin chunks");
        const routes = [];
        const batch = 3;
        for (let i = 0; i < total; i += batch) {
          const slice = [];
          for (let j = i; j < Math.min(total, i + batch); j++) slice.push(j);
          const parts = await Promise.all(
            slice.map((j) => fetchJson(base + "/chunks/routes-" + j + ".json"))
          );
          parts.forEach((p) => routes.push(...p));
          setBoot(15 + (80 * Math.min(total, i + batch)) / Math.max(total, 1));
        }
        if (!routes.length) throw new Error("No se cargaron rutas");
        setBoot(98);
        return { ...meta, routes };
      } catch (e) {
        lastErr = e;
        console.warn("Fallo carga desde", base, e);
      }
    }
    throw lastErr || new Error("No se pudo cargar el catálogo");
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-cache", mode: "cors" }).then(async (r) => {
      if (!r.ok) throw new Error("HTTP " + r.status + " en " + url.split("/").slice(-2).join("/"));
      return r.json();
    });
  }

  function routeDescription(r) {
    if (r.desc) return r.desc;
    const tipo = DATA.tipoNames[r.tipo] || r.tipo;
    const estilo =
      r.patron === "directo"
        ? "Servicio semirrápido con pocas paradas"
        : r.patron === "parador"
          ? "Servicio parador que cubre todas las estaciones del tramo"
          : r.patron === "retorno"
            ? "Sentido inverso del corredor principal"
            : "Servicio regular de la red";
    const eje = r.corredor && DATA.corredorNames[r.corredor] ? " sobre el eje " + DATA.corredorNames[r.corredor] : "";
    return (
      tipo +
      " operado por " +
      r.opn +
      " entre " +
      r.origen +
      " y " +
      r.destino +
      eje +
      ". " +
      estilo +
      "; " +
      r.n +
      " estaciones y unos " +
      r.km +
      " km. Material asignado: " +
      (r.mat || "—") +
      "."
    );
  }

  function trainUnits(r) {
    if (r.trenesU?.length) return r.trenesU;
    const count = r.trenes || 0;
    const prefix = String(r.matId || "EMU")
      .replace(/^unit-/, "")
      .replace(/[^a-zA-Z0-9]+/g, "")
      .slice(0, 8)
      .toUpperCase() || "EMU";
    const seed = (r.id || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0);
    const base = 100 + (seed % 800);
    return Array.from({ length: count }, (_, i) => prefix + "-" + String(base + i).padStart(3, "0"));
  }

  function fillSelect(sel, entries) {
    for (const v of entries) {
      const opt = document.createElement("option");
      opt.value = Array.isArray(v) ? v[0] : v;
      opt.textContent = Array.isArray(v) ? v[1] : v;
      sel.appendChild(opt);
    }
  }

  function mkChips(el, values, set) {
    el.innerHTML = values
      .map((v) => '<button type="button" class="chip" data-v="' + esc(v) + '">' + esc(v) + "</button>")
      .join("");
    el.querySelectorAll(".chip").forEach((btn) =>
      btn.addEventListener("click", () => {
        const v = btn.dataset.v;
        if (set.has(v)) set.delete(v);
        else set.add(v);
        btn.classList.toggle("on", set.has(v));
        applyFilters(true);
      })
    );
  }

  function initControls() {
    fillSelect($("tipo"), Object.entries(DATA.tipoNames));
    fillSelect($("prefijo"), uniq(DATA.routes.map((r) => r.prefijo)));
    fillSelect(
      $("op"),
      DATA.ops.map((o) => [o.id, o.nombre + " (" + o.corto + ")"])
    );
    fillSelect($("opTipo"), uniq(DATA.ops.map((o) => o.tipo)));
    fillSelect($("opTipo2"), uniq(DATA.ops.map((o) => o.tipo)));
    fillSelect($("corredor"), Object.entries(DATA.corredorNames));
    fillSelect($("land"), Object.entries(DATA.landNames));
    fillSelect($("opLand"), Object.entries(DATA.landNames));
    fillSelect($("opServ"), uniq(DATA.ops.flatMap((o) => o.servicios || [])));
    fillSelect(
      $("material"),
      [...new Map(DATA.routes.filter((r) => r.matId).map((r) => [r.matId, r.mat || r.matId])).entries()].sort((a, b) =>
        String(a[1]).localeCompare(String(b[1]), "es")
      )
    );
    mkChips($("estChips"), ["actual", "futuro", "inventado"], state.est);
    mkChips($("opEstChips"), ["actual", "futuro", "inventado"], state.opEst);
  }

  function numOr(id) {
    const v = $(id).value.trim();
    if (v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function parseTime(v) {
    const m = String(v || "").trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const h = Number(m[1]);
    const min = Number(m[2]);
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }

  function money(n, moneda) {
    if (n == null || n === "") return "—";
    return "£" + Number(n).toFixed(2) + (moneda && moneda !== "GBP" ? " " + moneda : "");
  }

  function routeMatch(r, q, qStation, qEndpoint) {
    if (state.est.size && !state.est.has(r.est)) return false;
    if ($("tipo").value && r.tipo !== $("tipo").value) return false;
    if ($("prefijo").value && r.prefijo !== $("prefijo").value) return false;
    if ($("op").value && r.op !== $("op").value) return false;
    if ($("opTipo").value) {
      const op = DATA.ops.find((o) => o.id === r.op);
      if (!op || op.tipo !== $("opTipo").value) return false;
    }
    if ($("corredor").value && r.corredor !== $("corredor").value) return false;
    if ($("land").value && !(r.lands || []).includes($("land").value)) return false;
    if ($("origenDatos").value && r.origen_datos !== $("origenDatos").value) return false;
    if ($("patron").value && r.patron !== $("patron").value) return false;
    if ($("material").value && r.matId !== $("material").value) return false;
    const qMat = $("qMaterial").value.trim().toLowerCase();
    if (qMat && !(r.mat || "").toLowerCase().includes(qMat) && !(r.matWs || "").toLowerCase().includes(qMat)) return false;

    const minN = numOr("minN");
    const maxN = numOr("maxN");
    const minKm = numOr("minKm");
    const maxKm = numOr("maxKm");
    const minFreq = numOr("minFreq");
    const maxFreq = numOr("maxFreq");
    const minTrenes = numOr("minTrenes");
    const maxTrenes = numOr("maxTrenes");
    const minPrice = numOr("minPrice");
    const maxPrice = numOr("maxPrice");
    if (minN != null && r.n < minN) return false;
    if (maxN != null && r.n > maxN) return false;
    if (minKm != null && r.km < minKm) return false;
    if (maxKm != null && r.km > maxKm) return false;
    if (minFreq != null && r.freq < minFreq) return false;
    if (maxFreq != null && r.freq > maxFreq) return false;
    if (minTrenes != null && (r.trenes == null || r.trenes < minTrenes)) return false;
    if (maxTrenes != null && (r.trenes == null || r.trenes > maxTrenes)) return false;
    if (minPrice != null && (r.pFull == null || r.pFull < minPrice)) return false;
    if (maxPrice != null && (r.pFull == null || r.pFull > maxPrice)) return false;

    const minPrimer = parseTime($("minPrimer").value);
    const maxPrimer = parseTime($("maxPrimer").value);
    const minUltimo = parseTime($("minUltimo").value);
    const maxUltimo = parseTime($("maxUltimo").value);
    const primer = parseTime(r.primer);
    const ultimo = parseTime(r.ultimo);
    if (minPrimer != null && (primer == null || primer < minPrimer)) return false;
    if (maxPrimer != null && (primer == null || primer > maxPrimer)) return false;
    if (minUltimo != null && (ultimo == null || ultimo < minUltimo)) return false;
    if (maxUltimo != null && (ultimo == null || ultimo > maxUltimo)) return false;

    if (qStation) {
      if (!(r.paradas || []).some((p) => p.toLowerCase().includes(qStation))) return false;
    }
    if (qEndpoint) {
      const o = (r.origen || "").toLowerCase();
      const d = (r.destino || "").toLowerCase();
      if (!o.includes(qEndpoint) && !d.includes(qEndpoint)) return false;
    }
    if (q) {
      const hay = [
        r.codigo,
        r.nombre,
        r.desc,
        r.opn,
        r.origen,
        r.destino,
        r.mat,
        r.matWs,
        r.primer,
        r.ultimo,
        ...(r.paradas || []),
        ...(r.trenesU || []),
        DATA.corredorNames[r.corredor] || "",
        DATA.tipoNames[r.tipo] || "",
      ]
        .join(" ")
        .toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function opMatch(o, q) {
    if (state.opEst.size && !state.opEst.has(o.estado)) return false;
    if ($("opTipo2").value && o.tipo !== $("opTipo2").value) return false;
    if ($("opComp").value && o.competencia !== $("opComp").value) return false;
    if ($("opLand").value && !(o.lands || []).includes($("opLand").value)) return false;
    if ($("opServ").value && !(o.servicios || []).includes($("opServ").value)) return false;
    if (q) {
      const lands = (o.lands || []).map((id) => DATA.landNames[id] || id).join(" ");
      const hay = [o.nombre, o.corto, o.sede, o.eslogan, o.tipo, o.estado, lands, ...(o.servicios || []), ...(o.flota || [])]
        .join(" ")
        .toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function sortItems(items) {
    const mode = $("sort").value;
    const arr = items.slice();
    const cmp = (a, b) => String(a).localeCompare(String(b), "es", { numeric: true });
    if (state.view === "ops") {
      if (mode === "nombre") arr.sort((a, b) => cmp(a.nombre, b.nombre));
      else arr.sort((a, b) => cmp(a.estado + a.nombre, b.estado + b.nombre));
      return arr;
    }
    if (mode === "codigo") arr.sort((a, b) => cmp(a.codigo, b.codigo));
    else if (mode === "nombre") arr.sort((a, b) => cmp(a.nombre, b.nombre));
    else if (mode === "paradas_desc") arr.sort((a, b) => b.n - a.n);
    else if (mode === "paradas_asc") arr.sort((a, b) => a.n - b.n);
    else if (mode === "km_desc") arr.sort((a, b) => b.km - a.km);
    else if (mode === "km_asc") arr.sort((a, b) => a.km - b.km);
    else if (mode === "freq_asc") arr.sort((a, b) => a.freq - b.freq);
    else if (mode === "precio_asc") arr.sort((a, b) => (a.pFull ?? 0) - (b.pFull ?? 0));
    else if (mode === "precio_desc") arr.sort((a, b) => (b.pFull ?? 0) - (a.pFull ?? 0));
    else if (mode === "trenes_desc") arr.sort((a, b) => (b.trenes ?? 0) - (a.trenes ?? 0));
    else if (mode === "primer_asc") arr.sort((a, b) => cmp(a.primer || "99:99", b.primer || "99:99"));
    return arr;
  }

  function applyFilters(resetPage = true) {
    const qTop = $("qTop").value.trim().toLowerCase();
    if (state.view === "routes") {
      const q = ($("q").value.trim() || qTop).toLowerCase();
      const qStation = $("qStation").value.trim().toLowerCase();
      const qEndpoint = $("qEndpoint").value.trim().toLowerCase();
      state.filtered = sortItems(DATA.routes.filter((r) => routeMatch(r, q, qStation, qEndpoint)));
    } else {
      const q = ($("opq").value.trim() || qTop).toLowerCase();
      state.filtered = sortItems(DATA.ops.filter((o) => opMatch(o, q)));
    }
    if (resetPage) state.page = 0;
    render();
  }

  function activeFilterChips() {
    const chips = [];
    const add = (k, v, clear) => chips.push({ k, v, clear });
    if (state.view === "routes") {
      if ($("q").value || $("qTop").value) add("Texto", $("q").value || $("qTop").value, () => { $("q").value = ""; $("qTop").value = ""; });
      if ($("qStation").value) add("Estación", $("qStation").value, () => ($("qStation").value = ""));
      if ($("qEndpoint").value) add("Extremo", $("qEndpoint").value, () => ($("qEndpoint").value = ""));
      [...state.est].forEach((v) => add("Estado", v, () => state.est.delete(v)));
      [
        ["tipo", "Tipo"],
        ["prefijo", "Prefijo"],
        ["op", "Operador"],
        ["opTipo", "Tipo op."],
        ["corredor", "Corredor"],
        ["land", "Región"],
        ["origenDatos", "Datos"],
        ["patron", "Patrón"],
        ["material", "Material"],
      ].forEach(([id, label]) => {
        if ($(id).value) add(label, $(id).selectedOptions[0]?.textContent || $(id).value, () => ($(id).value = ""));
      });
      if ($("qMaterial").value) add("Material texto", $("qMaterial").value, () => ($("qMaterial").value = ""));
      if ($("minN").value || $("maxN").value)
        add("Paradas", ($("minN").value || "…") + "-" + ($("maxN").value || "…"), () => { $("minN").value = ""; $("maxN").value = ""; });
      if ($("minKm").value || $("maxKm").value)
        add("Km", ($("minKm").value || "…") + "-" + ($("maxKm").value || "…"), () => { $("minKm").value = ""; $("maxKm").value = ""; });
      if ($("minFreq").value || $("maxFreq").value)
        add("Freq", ($("minFreq").value || "…") + "-" + ($("maxFreq").value || "…"), () => { $("minFreq").value = ""; $("maxFreq").value = ""; });
      if ($("minTrenes").value || $("maxTrenes").value)
        add("Trenes", ($("minTrenes").value || "…") + "-" + ($("maxTrenes").value || "…"), () => { $("minTrenes").value = ""; $("maxTrenes").value = ""; });
      if ($("minPrice").value || $("maxPrice").value)
        add("Precio", ($("minPrice").value || "…") + "-" + ($("maxPrice").value || "…"), () => { $("minPrice").value = ""; $("maxPrice").value = ""; });
      if ($("minPrimer").value || $("maxPrimer").value)
        add("Primer", ($("minPrimer").value || "…") + "-" + ($("maxPrimer").value || "…"), () => { $("minPrimer").value = ""; $("maxPrimer").value = ""; });
      if ($("minUltimo").value || $("maxUltimo").value)
        add("Último", ($("minUltimo").value || "…") + "-" + ($("maxUltimo").value || "…"), () => { $("minUltimo").value = ""; $("maxUltimo").value = ""; });
    } else {
      if ($("opq").value || $("qTop").value) add("Texto", $("opq").value || $("qTop").value, () => { $("opq").value = ""; $("qTop").value = ""; });
      [...state.opEst].forEach((v) => add("Estado", v, () => state.opEst.delete(v)));
      [
        ["opTipo2", "Tipo"],
        ["opComp", "Competencia"],
        ["opLand", "Región"],
        ["opServ", "Servicio"],
      ].forEach(([id, label]) => {
        if ($(id).value) add(label, $(id).selectedOptions[0]?.textContent || $(id).value, () => ($(id).value = ""));
      });
    }
    $("activeFilters").innerHTML = chips
      .map(
        (c, i) =>
          '<span class="af">' +
          esc(c.k) +
          ": <strong>" +
          esc(c.v) +
          '</strong><button type="button" data-i="' +
          i +
          '" aria-label="Quitar">×</button></span>'
      )
      .join("");
    $("activeFilters").querySelectorAll("button").forEach((btn) =>
      btn.addEventListener("click", () => {
        chips[Number(btn.dataset.i)].clear();
        document.querySelectorAll("#estChips .chip").forEach((b) => b.classList.toggle("on", state.est.has(b.dataset.v)));
        document.querySelectorAll("#opEstChips .chip").forEach((b) => b.classList.toggle("on", state.opEst.has(b.dataset.v)));
        applyFilters(true);
      })
    );
  }

  function render() {
    activeFilterChips();
    const total = state.filtered.length;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > pages - 1) state.page = pages - 1;
    const start = state.page * state.pageSize;
    const slice = state.filtered.slice(start, start + state.pageSize);
    $("resultCount").textContent =
      total +
      (state.view === "routes" ? " rutas" : " operadores") +
      " · mostrando " +
      (total ? start + 1 + "–" + Math.min(start + state.pageSize, total) : 0);
    $("pageInfo").textContent = "Página " + (state.page + 1) + " / " + pages;
    $("prev").disabled = state.page <= 0;
    $("next").disabled = state.page >= pages - 1;

    if (!slice.length) {
      $("list").innerHTML =
        '<div class="empty"><h3>Sin resultados</h3><p>Prueba a quitar algún filtro o ampliar el rango.</p></div>';
      return;
    }

    if (state.view === "routes") {
      $("list").innerHTML = slice
        .map(
          (r) =>
            '<article class="card" data-id="' +
            esc(r.id) +
            '" tabindex="0" role="button"><div class="card-head"><div class="left-head"><div><div class="code"><span class="swatch" style="background:' +
            esc(r.color) +
            '"></span>' +
            esc(r.codigo) +

            esc(r.nombre) +

            esc(r.freq) +
            " min</span><span>" +
            esc(r.primer || "—") +
            "–" +
            esc(r.ultimo || "—") +
            "</span><span>" +
            esc(r.trenes ?? "—") +
            " trenes</span><span>" +
            esc(money(r.pFull, r.moneda)) +
            "</span><span>" +
            esc(r.mat || "—") +
            '</span></div></div></div></div><div class="stops">' +
            stopsHtml(r.paradas) +
            "</div></article>"
        )
        .join("");
      $("list").querySelectorAll(".card").forEach((card) =>
        card.addEventListener("click", () => {
          const r = state.filtered.find((x) => x.id === card.dataset.id) || DATA.routes.find((x) => x.id === card.dataset.id);
          if (r) openRoute(r);
        })
      );
    } else {
      $("list").innerHTML = slice
        .map((o) => {
          const logo = DATA.logos[o.id]
            ? '<img class="logo" src="' + DATA.logos[o.id] + '" alt=""/>'
            : '<div class="logo" style="background:' + esc(o.color) + '"></div>';
          const lands = (o.lands || [])
            .map((id) => DATA.landNames[id] || id)
            .slice(0, 4)
            .join(", ");
          return (
            '<article class="card" data-id="' +
            esc(o.id) +
            '" tabindex="0" role="button"><div class="card-head"><div class="left-head">' +
            logo +
            '<div><div class="title">' +
            esc(o.nombre) +
            '</div><div class="meta"><span class="badge b-' +
            esc(o.estado) +
            '">' +
            esc(o.estado) +
            "</span><span>" +
            esc(o.tipo) +
            "</span><span>" +
            esc(o.sede) +
            "</span><span>" +
            esc(lands) +
            '</span></div><div class="meta" style="margin-top:.35rem">' +
            esc(o.eslogan || "") +
            "</div></div></div></div></article>"
          );
        })
        .join("");
      $("list").querySelectorAll(".card").forEach((card) =>
        card.addEventListener("click", () => {
          const o = DATA.ops.find((x) => x.id === card.dataset.id);
          if (o) openOp(o);
        })
      );
    }
  }

  function setView(view) {
    state.view = view;
    document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    $("filters-routes").hidden = view !== "routes";
    $("filters-ops").hidden = view !== "ops";
    applyFilters(true);
  }

  function resetAll() {
    [
      "q", "qTop", "qStation", "qEndpoint", "opq", "tipo", "prefijo", "op", "opTipo", "corredor", "land",
      "origenDatos", "patron", "material", "qMaterial", "minN", "maxN", "minKm", "maxKm", "minFreq", "maxFreq",
      "minTrenes", "maxTrenes", "minPrice", "maxPrice", "minPrimer", "maxPrimer", "minUltimo", "maxUltimo",
      "opTipo2", "opComp", "opLand", "opServ",
    ].forEach((id) => {
      if ($(id)) $(id).value = "";
    });
    state.est.clear();
    state.opEst.clear();
    document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
    applyFilters(true);
  }

  let t = null;
  function live() {
    clearTimeout(t);
    t = setTimeout(() => applyFilters(true), 120);
  }

  function startApp() {
  initControls();
  renderMetrics();
  setView("routes");

  document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  $("applyBtn").onclick = () => applyFilters(true);
  $("resetBtn").onclick = resetAll;
  $("prev").onclick = () => {
    state.page--;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  $("next").onclick = () => {
    state.page++;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  $("sort").onchange = () => applyFilters(true);
  $("pageSizeSeg").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => {
      $("pageSizeSeg").querySelectorAll("button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      state.pageSize = Number(b.dataset.size);
      applyFilters(true);
    })
  );
  [
    "q", "qTop", "qStation", "qEndpoint", "opq", "tipo", "prefijo", "op", "opTipo", "corredor", "land",
    "origenDatos", "patron", "material", "qMaterial", "minN", "maxN", "minKm", "maxKm", "minFreq", "maxFreq",
    "minTrenes", "maxTrenes", "minPrice", "maxPrice", "minPrimer", "maxPrimer", "minUltimo", "maxUltimo",
    "opTipo2", "opComp", "opLand", "opServ",
  ].forEach((id) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener("input", live);
    el.addEventListener("change", live);
  });
  $("qTop").addEventListener("input", () => {
    if (state.view === "routes") $("q").value = $("qTop").value;
    else $("opq").value = $("qTop").value;
    live();
  });
  $("closeDrawer").onclick = () => {
    $("drawer").classList.remove("on");
    $("backdrop").classList.remove("on");
  };
  $("backdrop").onclick = () => {
    $("drawer").classList.remove("on");
    $("backdrop").classList.remove("on");
  };
  $("toggleFilters").onclick = () => $("sidebar").classList.toggle("open");
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      $("drawer").classList.remove("on");
      $("backdrop").classList.remove("on");
      $("sidebar").classList.remove("open");
    }
  });
  }

  async function boot() {
    try {
      if (!DATA?.routes?.length) {
        DATA = await loadCatalogFromCdn();
        window.CATALOG_DATA = DATA;
      } else {
        setBoot(100);
      }
      hideBoot();
      startApp();
    } catch (e) {
      console.error(e);
      setBoot(100, (e && e.message) || "Error cargando el catálogo. Revisa la conexión e inténtalo de nuevo.");
    }
  }

  boot();
})();

</script>
</body>
</html>
