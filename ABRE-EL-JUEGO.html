<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loterías Álora — Miriam</title>
<style>
/* src/style.css */
:root,
[data-theme=light] {
  --bg0: #e8f0f2;
  --bg1: #f7fafb;
  --ink: #1a2b33;
  --muted: #5a727c;
  --line: #c5d5db;
  --brand: #0e6b7a;
  --brand-deep: #0a4f5a;
  --accent: #e2a03a;
  --accent-ink: #3d2a0a;
  --ok: #1f7a4c;
  --bad: #a33b3b;
  --panel: rgba(255, 255, 255, 0.82);
  --shadow: 0 18px 50px rgba(26, 43, 51, 0.1);
  --radius: 18px;
  --font-display:
    "Fraunces",
    Georgia,
    serif;
  --font-body: "Manrope", sans-serif;
  --bg-grad-a: rgba(14, 107, 122, 0.18);
  --bg-grad-b: rgba(226, 160, 58, 0.16);
  --bg-grad-c: #dce9ec;
  --bg-grad-d: #eef5f2;
}
[data-theme=dark] {
  --bg0: #122026;
  --bg1: #1a2d35;
  --ink: #e8f2f5;
  --muted: #9bb0b8;
  --line: #2f4750;
  --brand: #3db8c9;
  --brand-deep: #8fd4de;
  --accent: #e2a03a;
  --accent-ink: #3d2a0a;
  --ok: #3ecf8e;
  --bad: #e06a6a;
  --panel: rgba(22, 38, 45, 0.9);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --bg-grad-a: rgba(61, 184, 201, 0.12);
  --bg-grad-b: rgba(226, 160, 58, 0.1);
  --bg-grad-c: #101c22;
  --bg-grad-d: #152830;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(
      1200px 600px at 10% -10%,
      var(--bg-grad-a),
      transparent 60%),
    radial-gradient(
      900px 500px at 100% 0%,
      var(--bg-grad-b),
      transparent 55%),
    linear-gradient(
      165deg,
      var(--bg-grad-c) 0%,
      var(--bg1) 45%,
      var(--bg-grad-d) 100%);
  background-attachment: fixed;
  transition: background 0.35s ease, color 0.25s ease;
}
button,
input,
select {
  font: inherit;
}
#app {
  min-height: 100vh;
}
.shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 24px 40px;
}
.topbar {
  display: grid;
  grid-template-columns: 1.2fr 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 16px 20px;
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: rise 0.6s ease both;
}
.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 1.85rem;
  line-height: 1.1;
  color: var(--brand-deep);
  letter-spacing: -0.02em;
}
.brand-sub {
  color: var(--muted);
  font-size: 0.95rem;
}
.clock-block {
  text-align: center;
}
.clock-time {
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: 0.04em;
}
.clock-date {
  color: var(--muted);
  text-transform: capitalize;
  font-size: 0.92rem;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}
.status-pill.open {
  background: rgba(31, 122, 76, 0.12);
  color: var(--ok);
}
.status-pill.closed {
  background: rgba(163, 59, 59, 0.12);
  color: var(--bad);
}
.speed-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;
}
.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(26, 43, 51, 0.08);
}
.btn:active {
  transform: translateY(0);
}
.btn.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 700;
}
.btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  background: #fff5f5;
  border-color: #e7b6b6;
  color: var(--bad);
}
.layout {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  gap: 16px;
  margin-top: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  animation: rise 0.7s ease both;
}
.panel h2,
.panel h3 {
  font-family: var(--font-display);
  margin: 0 0 10px;
  color: var(--brand-deep);
}
.muted {
  color: var(--muted);
}
.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.95rem;
}
.stat-row:last-child {
  border-bottom: none;
}
.counter-stage {
  min-height: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-counter {
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  padding: 28px 24px;
  background:
    linear-gradient(
      120deg,
      rgba(14, 107, 122, 0.92),
      rgba(10, 79, 90, 0.88)),
    repeating-linear-gradient(
      -12deg,
      rgba(255, 255, 255, 0.04) 0 8px,
      rgba(255, 255, 255, 0) 8px 16px);
  color: #f4fbfc;
  min-height: 180px;
}
.hero-counter::after {
  content: "";
  position: absolute;
  right: -40px;
  bottom: -50px;
  width: 220px;
  height: 220px;
  border-radius: 40% 60% 55% 45%;
  background: rgba(226, 160, 58, 0.25);
  animation: drift 8s ease-in-out infinite alternate;
}
.hero-counter h2 {
  position: relative;
  z-index: 1;
  color: #fff;
  font-size: 1.8rem;
  margin: 0 0 8px;
}
.hero-counter p {
  position: relative;
  z-index: 1;
  margin: 0;
  max-width: 40ch;
  opacity: 0.95;
}
.client-card {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  background: #fff;
  animation: pop 0.35s ease both;
}
.client-card h3 {
  margin: 0 0 4px;
  font-size: 1.35rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.log {
  max-height: 260px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.9rem;
}
.log-item {
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(14, 107, 122, 0.06);
}
.menu-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.menu-card {
  width: min(720px, 100%);
  background: var(--panel);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.8);
  animation: rise 0.7s ease both;
}
.menu-card h1 {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 5vw, 3.4rem);
  margin: 0;
  color: var(--brand-deep);
  line-height: 1.05;
}
.menu-card .tagline {
  margin: 10px 0 22px;
  color: var(--muted);
  font-size: 1.05rem;
}
.slot-grid {
  display: grid;
  gap: 10px;
  margin: 18px 0;
}
.slot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
}
.disclaimer {
  margin-top: 18px;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.4;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  z-index: 50;
  animation: pop 0.25s ease both;
}
.cash-screen {
  display: grid;
  gap: 16px;
}
.cash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.denom-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.denom {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 8px;
  text-align: center;
}
.denom .label {
  font-weight: 700;
  margin-bottom: 6px;
}
.denom .row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.denom button {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #f4f8f9;
  cursor: pointer;
}
.method-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.totals {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.total-box {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.total-box strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.3rem;
  margin-top: 4px;
}
.error-box {
  background: #fff1f1;
  color: var(--bad);
  border: 1px solid #ecc0c0;
  border-radius: 12px;
  padding: 10px 12px;
}
.close-summary {
  display: grid;
  gap: 8px;
}
.nav-side .btn {
  width: 100%;
  margin-bottom: 8px;
  text-align: left;
}
.stock-list {
  max-height: 320px;
  overflow: auto;
  display: grid;
  gap: 6px;
}
.stock-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.88rem;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes drift {
  from {
    transform: translate(0, 0) rotate(0deg);
  }
  to {
    transform: translate(-20px, -12px) rotate(12deg);
  }
}
.tpv-wrap {
  display: grid;
  grid-template-columns: 160px 1fr 300px;
  gap: 12px;
  margin-top: 16px;
  min-height: 70vh;
}
.tpv-cats {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpv-cats .btn {
  width: 100%;
  text-align: center;
  font-weight: 700;
  min-height: 48px;
}
.tpv-products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  align-content: start;
}
.tpv-product {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  text-align: left;
}
.tpv-product strong {
  display: block;
  font-size: 0.92rem;
}
.tpv-product span {
  color: var(--muted);
  font-size: 0.8rem;
}
.tpv-cart {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpv-line {
  border-bottom: 1px dashed var(--line);
  padding-bottom: 8px;
  font-size: 0.88rem;
}
.queue-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.queue-item {
  background: rgba(14, 107, 122, 0.08);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.88rem;
}
.wish-list {
  margin: 8px 0;
  padding: 0;
  list-style: none;
}
.wish-list li {
  padding: 4px 0;
  border-bottom: 1px dashed var(--line);
}
.dictate-box {
  background: #fff8e8;
  border: 1px solid #e6d2a8;
  border-radius: 12px;
  padding: 12px;
  margin-top: 10px;
}
.dictate-box textarea {
  width: 100%;
  min-height: 70px;
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 8px;
  font: inherit;
}
.notice-banner {
  margin: 8px 0 0;
  padding: 12px 16px;
  background: rgba(14, 107, 122, 0.14);
  border: 2px solid rgba(14, 107, 122, 0.45);
  border-radius: 12px;
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--brand-deep);
  box-shadow: 0 0 0 1px rgba(14, 107, 122, 0.08);
  animation: notice-pulse 2.8s ease-in-out infinite;
}
.notice-banner.sticky-notice {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(6px);
}
.notice-banner-detail {
  margin-top: 4px;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.35;
  opacity: 0.92;
}
@keyframes notice-pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(14, 107, 122, 0.15);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(14, 107, 122, 0.12);
  }
}
.pause-banner {
  margin: 8px 0 0;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid rgba(140, 90, 20, 0.4);
  background: rgba(196, 140, 0, 0.14);
  color: var(--ink);
  animation: rise 0.35s ease both;
}
.pause-banner strong {
  display: block;
  margin-bottom: 4px;
  color: #8a5a00;
}
.alert-banner--cash {
  border-color: rgba(140, 90, 20, 0.4);
  background: rgba(196, 140, 0, 0.14);
}
.alert-banner--cash strong {
  color: #8a5a00;
}
.product-next {
  font-size: 0.78rem;
  margin-top: 2px;
}
.showcase-warn ul {
  margin: 6px 0 0;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}
.data-table th,
.data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.data-table th {
  font-weight: 700;
  color: var(--brand-deep);
  background: rgba(14, 107, 122, 0.06);
}
.jackpot-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  margin: 6px 0 0;
  padding: 6px 4px;
  font-size: 0.82rem;
  color: var(--muted);
}
.jackpot-strip strong {
  color: var(--ink);
  font-weight: 700;
  margin-right: 4px;
}
.wish-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.88rem;
}
.wish-ok {
  color: #0b6b3a;
  background: rgba(11, 107, 58, 0.08);
  border-radius: 8px;
  padding: 4px 8px;
}
.wish-miss {
  color: #9b1c1c;
  background: rgba(155, 28, 28, 0.08);
  border-radius: 8px;
  padding: 4px 8px;
}
.wish-extra {
  color: #8a5a00;
  background: rgba(196, 140, 0, 0.12);
  border-radius: 8px;
  padding: 4px 8px;
}
.alert-banner {
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(163, 59, 59, 0.35);
  background: rgba(163, 59, 59, 0.12);
  animation: rise 0.45s ease both;
}
.alert-banner strong {
  color: var(--bad);
}
.day-results {
  animation: rise 0.55s ease both;
}
.check-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.4);
}
[data-theme=dark] .check-compare {
  background: rgba(0, 0, 0, 0.22);
}
.check-compare-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.check-compare-label {
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.check-compare-col strong {
  font-size: 0.98rem;
  line-height: 1.35;
  word-break: break-word;
}
.check-compare-vs {
  align-self: center;
  font-family: var(--font-display);
  font-size: 0.85rem;
  color: var(--brand);
  opacity: 0.85;
}
@media (max-width: 640px) {
  .check-compare {
    grid-template-columns: 1fr;
  }
  .check-compare-vs {
    justify-self: start;
  }
}
.showcase-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.showcase-item {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.35);
}
[data-theme=dark] .showcase-item {
  background: rgba(0, 0, 0, 0.2);
}
@media (max-width: 1100px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .topbar {
    grid-template-columns: 1fr;
  }
  .method-grid {
    grid-template-columns: 1fr 1fr;
  }
  .cash-grid,
  .totals {
    grid-template-columns: 1fr;
  }
  .tpv-wrap {
    grid-template-columns: 1fr;
  }
}
.product-meta {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.3;
}
#autosave-hint {
  font-size: 0.78rem;
  margin: 8px 0 0;
  line-height: 1.35;
}
.scratch-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  background: rgba(18, 32, 38, 0.55);
  backdrop-filter: blur(3px);
  animation: rise 0.25s ease both;
}
.scratch-card {
  width: min(360px, 90vw);
  padding: 28px 24px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  text-align: center;
}
.scratch-anim {
  font-size: 2.4rem;
  color: var(--accent);
  animation: scratch-wiggle 0.45s ease-in-out infinite alternate;
  margin-bottom: 8px;
}
@keyframes scratch-wiggle {
  from {
    transform: rotate(-12deg) translateX(-4px);
  }
  to {
    transform: rotate(10deg) translateX(4px);
  }
}
.nav-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}
.nav-group-title {
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 4px 0 2px;
  font-weight: 700;
}
.nav-side .nav-group .btn {
  margin-bottom: 0;
}
.autosave-badge {
  margin-top: 6px;
  display: inline-block;
  font-size: 0.78rem;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(14, 107, 122, 0.08);
  color: var(--brand-deep);
  transition: background 0.25s ease, transform 0.25s ease;
}
.autosave-badge.flash {
  background: rgba(31, 122, 76, 0.2);
  transform: scale(1.03);
}
[data-theme=dark] .autosave-badge {
  background: rgba(61, 184, 201, 0.12);
  color: var(--brand-deep);
}
.product-sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  background: rgba(18, 32, 38, 0.5);
  backdrop-filter: blur(2px);
  padding: 20px;
  animation: rise 0.2s ease both;
}
.product-sheet {
  width: min(480px, 96vw);
  max-height: 90vh;
  overflow: auto;
  box-shadow: var(--shadow);
}
.cash-keys-hint {
  margin: 8px 0 0;
  font-size: 0.82rem;
}
.board-item[data-kind=sorteo],
.board-item.sorteo {
