<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loterías Álora — Miriam</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* src/style.css */
:root,
[data-theme=light] {
  --bg0: #dff3f0;
  --bg1: #fff9f2;
  --ink: #16323a;
  --muted: #4f6d75;
  --line: #b7d4d0;
  --brand: #0c8a8a;
  --brand-deep: #065f63;
  --accent: #f0a202;
  --accent-ink: #3a2800;
  --ok: #1b8a5a;
  --bad: #c23b4a;
  --coral: #e86a5d;
  --sky: #3aa8c1;
  --panel: rgba(255, 255, 255, 0.88);
  --shadow: 0 16px 40px rgba(6, 95, 99, 0.12);
  --radius: 20px;
  --font-display:
    "Fraunces",
    Georgia,
    serif;
  --font-body:
    "Plus Jakarta Sans",
    "Manrope",
    sans-serif;
  --bg-grad-a: rgba(12, 138, 138, 0.22);
  --bg-grad-b: rgba(240, 162, 2, 0.18);
  --bg-grad-c: #d4efe9;
  --bg-grad-d: #fff6ea;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
}
[data-theme=dark] {
  --bg0: #0f2428;
  --bg1: #163239;
  --ink: #eaf6f4;
  --muted: #9cb8b8;
  --line: #2a4a50;
  --brand: #3ecfc4;
  --brand-deep: #9be7df;
  --accent: #f0b429;
  --accent-ink: #2a1f00;
  --ok: #45d18c;
  --bad: #f07178;
  --coral: #f08a7a;
  --sky: #5ec4d8;
  --panel: rgba(18, 40, 46, 0.92);
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
  --bg-grad-a: rgba(62, 207, 196, 0.14);
  --bg-grad-b: rgba(240, 180, 41, 0.12);
  --bg-grad-c: #0d1f24;
  --bg-grad-d: #152f36;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
}
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(
      1200px 600px at 10% -10%,
      var(--bg-grad-a),
      transparent 60%),
    radial-gradient(
      900px 500px at 100% 0%,
      var(--bg-grad-b),
      transparent 55%),
    linear-gradient(
      165deg,
      var(--bg-grad-c) 0%,
      var(--bg1) 45%,
      var(--bg-grad-d) 100%);
  background-attachment: fixed;
  transition: background 0.35s ease, color 0.25s ease;
}
button,
input,
select {
  font: inherit;
}
#app {
  min-height: 100vh;
}
.shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 24px 40px;
}
.topbar {
  display: grid;
  grid-template-columns: 1.2fr 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 16px 20px;
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: rise 0.6s ease both;
}
.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 1.85rem;
  line-height: 1.1;
  color: var(--brand-deep);
  letter-spacing: -0.02em;
}
.brand-sub {
  color: var(--muted);
  font-size: 0.95rem;
}
.clock-block {
  text-align: center;
}
.clock-time {
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: 0.04em;
}
.clock-date {
  color: var(--muted);
  text-transform: capitalize;
  font-size: 0.92rem;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}
.status-pill.open {
  background: rgba(31, 122, 76, 0.12);
  color: var(--ok);
}
.status-pill.closed {
  background: rgba(163, 59, 59, 0.12);
  color: var(--bad);
}
.speed-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 14px;
  padding: 10px 14px;
  cursor: pointer;
  transition:
    transform 0.22s var(--ease-spring),
    box-shadow 0.22s var(--ease-out),
    background 0.22s var(--ease-out),
    border-color 0.22s var(--ease-out),
    color 0.18s ease,
    opacity 0.18s ease;
}
.btn:hover {
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 10px 22px rgba(6, 95, 99, 0.12);
  border-color: var(--brand);
}
.btn:active {
  transform: translateY(0) scale(0.98);
  transition-duration: 0.08s;
}
.btn.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: 700;
}
.btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  background: #fff5f5;
  border-color: #e7b6b6;
  color: var(--bad);
}
.layout {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  gap: 16px;
  margin-top: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  animation: rise 0.55s var(--ease-out) both;
  transition:
    box-shadow 0.3s var(--ease-out),
    transform 0.3s var(--ease-out),
    border-color 0.25s ease;
}
.panel:hover {
  box-shadow: 0 20px 48px rgba(6, 95, 99, 0.14);
}
.panel h2,
.panel h3 {
  font-family: var(--font-display);
  margin: 0 0 10px;
  color: var(--brand-deep);
}
.muted {
  color: var(--muted);
}
.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.95rem;
}
.stat-row:last-child {
  border-bottom: none;
}
.counter-stage {
  min-height: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero-counter {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  padding: 28px 24px;
  background:
    linear-gradient(
      125deg,
      rgba(12, 138, 138, 0.95),
      rgba(6, 95, 99, 0.9) 55%,
      rgba(240, 162, 2, 0.55)),
    repeating-linear-gradient(
      -12deg,
      rgba(255, 255, 255, 0.05) 0 8px,
      rgba(255, 255, 255, 0) 8px 16px);
  color: #f4fbfc;
  min-height: 180px;
  animation: rise 0.5s var(--ease-out) both;
}
.hero-counter::after {
  content: "";
  position: absolute;
  right: -40px;
  bottom: -50px;
  width: 220px;
  height: 220px;
  border-radius: 40% 60% 55% 45%;
  background: rgba(226, 160, 58, 0.25);
  animation: drift 8s ease-in-out infinite alternate;
}
.hero-counter h2 {
  position: relative;
  z-index: 1;
  color: #fff;
  font-size: 1.8rem;
  margin: 0 0 8px;
}
.hero-counter p {
  position: relative;
  z-index: 1;
  margin: 0;
  max-width: 40ch;
  opacity: 0.95;
}
.client-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 18px;
  background:
    linear-gradient(
      180deg,
      #fff 0%,
      #f7fcfb 100%);
  animation: pop 0.4s var(--ease-spring) both;
  transition:
    border-color 0.25s var(--ease-out),
    box-shadow 0.25s var(--ease-out),
    transform 0.25s var(--ease-out);
  box-shadow: 0 8px 24px rgba(6, 95, 99, 0.06);
}
.client-card:hover {
  border-color: rgba(12, 138, 138, 0.45);
  box-shadow: 0 14px 32px rgba(6, 95, 99, 0.1);
}
.client-card.intent-pickup {
  border-color: rgba(27, 138, 90, 0.45);
  background:
    linear-gradient(
      180deg,
      #f3fff8 0%,
      #fff 100%);
}
.client-card.intent-showcase_ask {
  border-color: rgba(240, 162, 2, 0.5);
  background:
    linear-gradient(
      180deg,
      #fffaf0 0%,
      #fff 100%);
}
.client-card.intent-check {
  border-color: rgba(58, 168, 193, 0.45);
}
.client-card h3 {
  margin: 0 0 4px;
  font-size: 1.35rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.log {
  max-height: 260px;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.9rem;
}
.log-item {
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(14, 107, 122, 0.06);
}
.menu-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.menu-card {
  width: min(720px, 100%);
  background: var(--panel);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.8);
  animation: rise 0.7s ease both;
}
.menu-card h1 {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 5vw, 3.4rem);
  margin: 0;
  color: var(--brand-deep);
  line-height: 1.05;
}
.menu-card .tagline {
  margin: 10px 0 22px;
  color: var(--muted);
  font-size: 1.05rem;
}
.slot-grid {
  display: grid;
  gap: 10px;
  margin: 18px 0;
}
.slot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
}
.disclaimer {
  margin-top: 18px;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.4;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  box-shadow: var(--shadow);
  z-index: 50;
  animation: pop 0.25s ease both;
}
.cash-screen {
  display: grid;
  gap: 16px;
}
.cash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.denom-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.denom {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 8px;
  text-align: center;
}
.denom .label {
  font-weight: 700;
  margin-bottom: 6px;
}
.denom .row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.denom button {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #f4f8f9;
  cursor: pointer;
}
.method-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.totals {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.total-box {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.total-box strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.3rem;
  margin-top: 4px;
}
.error-box {
  background: #fff1f1;
  color: var(--bad);
  border: 1px solid #ecc0c0;
  border-radius: 12px;
  padding: 10px 12px;
}
.close-summary {
  display: grid;
  gap: 8px;
}
.nav-side .btn {
  width: 100%;
  margin-bottom: 8px;
  text-align: left;
}
.stock-list {
  max-height: 320px;
  overflow: auto;
  display: grid;
  gap: 6px;
}
.stock-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.88rem;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes drift {
  from {
    transform: translate(0, 0) rotate(0deg);
  }
  to {
    transform: translate(-20px, -12px) rotate(12deg);
  }
}
.tpv-wrap {
  display: grid;
  grid-template-columns: 160px 1fr 300px;
  gap: 12px;
  margin-top: 16px;
  min-height: 70vh;
}
.tpv-cats {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpv-cats .btn {
  width: 100%;
  text-align: center;
  font-weight: 700;
  min-height: 48px;
}
.tpv-products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  align-content: start;
}
.tpv-product {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  text-align: left;
}
.tpv-product strong {
  display: block;
  font-size: 0.92rem;
}
.tpv-product span {
  color: var(--muted);
  font-size: 0.8rem;
}
.tpv-cart {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tpv-line {
  border-bottom: 1px dashed var(--line);
  padding-bottom: 8px;
  font-size: 0.88rem;
}
.queue-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.queue-item {
  background: rgba(14, 107, 122, 0.08);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 0.88rem;
}
.wish-list {
  margin: 8px 0;
  padding: 0;
  list-style: none;
}
.wish-list li {
  padding: 4px 0;
  border-bottom: 1px dashed var(--line);
}
.dictate-box {
  background: #fff8e8;
  border: 1px solid #e6d2a8;
  border-radius: 12px;
  padding: 12px;
  margin-top: 10px;
}
.dictate-box textarea {
  width: 100%;
  min-height: 70px;
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 8px;
  font: inherit;
}
.notice-banner {
  margin: 8px 0 0;
  padding: 12px 16px;
  background: rgba(12, 138, 138, 0.14);
  border: 2px solid rgba(12, 138, 138, 0.4);
  border-radius: 14px;
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--brand-deep);
  box-shadow: 0 0 0 1px rgba(12, 138, 138, 0.08);
  animation: notice-pulse 2.8s ease-in-out infinite, rise 0.45s var(--ease-out) both;
  transition: transform 0.25s var(--ease-out), background 0.25s ease;
}
.notice-banner.draw-live {
  background:
    linear-gradient(
      90deg,
      rgba(232, 106, 93, 0.18),
      rgba(240, 162, 2, 0.2));
  border-color: rgba(232, 106, 93, 0.55);
  color: #8a2e28;
  animation: notice-pulse 1.6s ease-in-out infinite, rise 0.4s var(--ease-spring) both;
}
[data-theme=dark] .notice-banner.draw-live {
  color: #ffc9c4;
}
.notice-banner.sticky-notice {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(6px);
}
.notice-banner-detail {
  margin-top: 4px;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.35;
  opacity: 0.92;
}
@keyframes notice-pulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(14, 107, 122, 0.15);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(14, 107, 122, 0.12);
  }
}
.pause-banner {
  margin: 8px 0 0;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid rgba(140, 90, 20, 0.4);
  background: rgba(196, 140, 0, 0.14);
  color: var(--ink);
  animation: rise 0.35s ease both;
}
.pause-banner strong {
  display: block;
  margin-bottom: 4px;
  color: #8a5a00;
}
.alert-banner--cash {
  border-color: rgba(140, 90, 20, 0.4);
  background: rgba(196, 140, 0, 0.14);
}
.alert-banner--cash strong {
  color: #8a5a00;
}
.product-next {
  font-size: 0.78rem;
  margin-top: 2px;
}
.showcase-warn ul {
  margin: 6px 0 0;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}
.data-table th,
.data-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.data-table th {
  font-weight: 700;
  color: var(--brand-deep);
  background: rgba(14, 107, 122, 0.06);
}
.jackpot-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  margin: 6px 0 0;
  padding: 6px 4px;
  font-size: 0.82rem;
  color: var(--muted);
}
.jackpot-strip strong {
  color: var(--ink);
  font-weight: 700;
  margin-right: 4px;
}
.wish-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.88rem;
}
.wish-ok {
  color: #0b6b3a;
  background: rgba(11, 107, 58, 0.08);
  border-radius: 8px;
  padding: 4px 8px;
}
.wish-miss {
  color: #9b1c1c;
  background: rgba(155, 28, 28, 0.08);
  border-radius: 8px;
  padding: 4px 8px;
}
.wish-extra {
  color: #8a5a00;
  background: rgba(196, 140, 0, 0.12);
  border-radius: 8px;
  padding: 4px 8px;
}
.alert-banner {
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(163, 59, 59, 0.35);
  background: rgba(163, 59, 59, 0.12);
  animation: rise 0.45s ease both;
}
.alert-banner strong {
  color: var(--bad);
}
.day-results {
  animation: rise 0.55s ease both;
}
.check-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: stretch;
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.4);
}
[data-theme=dark] .check-compare {
  background: rgba(0, 0, 0, 0.22);
}
.check-compare-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.check-compare-label {
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.check-compare-col strong {
  font-size: 0.98rem;
  line-height: 1.35;
  word-break: break-word;
}
.check-compare-vs {
  align-self: center;
  font-family: var(--font-display);
  font-size: 0.85rem;
  color: var(--brand);
  opacity: 0.85;
}
@media (max-width: 640px) {
  .check-compare {
    grid-template-columns: 1fr;
  }
  .check-compare-vs {
    justify-self: start;
  }
}
.showcase-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.showcase-item {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.35);
}
[data-theme=dark] .showcase-item {
  background: rgba(0, 0, 0, 0.2);
}
@media (max-width: 1100px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .topbar {
    grid-template-columns: 1fr;
  }
  .method-grid {
    grid-template-columns: 1fr 1fr;
  }
  .cash-grid,
  .totals {

  function makeChange(drawer, changeCents) {
    if (changeCents < 0) return null;
    if (changeCents === 0) return emptyDrawer();
    const sorted = [...ALL_DENOMS].sort((a, b) => b.cents - a.cents);
    const result = emptyDrawer();
    let remaining = changeCents;
    const temp = { ...drawer };
    for (const d of sorted) {
      const available = temp[d.id] || 0;
      const need = Math.floor(remaining / d.cents);
      const take = Math.min(available, need);
      if (take > 0) {
        result[d.id] = take;
        remaining -= take * d.cents;
        temp[d.id] -= take;
      }
    }
    if (remaining !== 0) return null;
    return result;
  }

  function easterSunday(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = (h + l - 7 * m + 114) % 31 + 1;
    return new Date(Date.UTC(year, month - 1, day));
  }
