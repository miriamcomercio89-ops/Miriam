# Deploy EuroPerote catalog to GitHub Pages
name: Deploy EuroPerote catalog
on:
  push:
    branches: [cursor/red-ferroviaria-alemania-555a, main]
    paths:
      - "europerote-ets2/web/**"
      - ".github/workflows/deploy-europerote-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-europerote
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: europerote-ets2/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
